<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeff記帳本</title>
    <!-- iOS Web App & Home Screen Icon Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Jeff記帳本">
    <link rel="apple-touch-icon" id="appleTouchIcon" href="">
    <link rel="icon" id="faviconIcon" href="">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS CDN (Excel 匯出套件) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts: Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        muji: {
                            bg: '#FAF7F2',        // 奶油暖白底色
                            card: '#FFFFFF',      // 純白卡片
                            border: '#EFECE6',    // 柔和質感邊框
                            dark: '#3B3632',      // 暖炭灰文字
                            muted: '#8C827A',     // 莫蘭迪次要文字
                            accent: '#D4C3AC',    // 燕麥奶大地色
                            income: '#4E7A62',    // 鼠尾草綠 (收入)
                            incomeBg: '#EAF2ED',
                            expense: '#C05A46',   // 陶土紅 (支出)
                            expenseBg: '#FDF0EE'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAF7F2;
            color: #3B3632;
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen max-w-md mx-auto relative shadow-md bg-muji-bg flex flex-col justify-between pb-24 border-x border-muji-border/60">

    <!-- 頂部標題列 -->
    <header class="bg-muji-card/80 backdrop-blur-md sticky top-0 z-30 px-6 py-4 border-b border-muji-border flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-muji-accent/30 flex items-center justify-center text-muji-dark">
                <i class="fa-solid font-bold fa-book-open text-xs"></i>
            </div>
            <h1 class="text-lg font-bold tracking-wide text-muji-dark">Jeff記帳本</h1>
        </div>
        <span id="headerMonth" class="text-xs font-medium text-muji-muted bg-muji-bg px-3 py-1 rounded-full border border-muji-border">
            -- 年 -- 月
        </span>
    </header>

    <!-- 主體內容分頁 container -->
    <main class="flex-1 p-5 space-y-5">

        <!-- ===== 分頁 1: 記帳輸入 ===== -->
        <section id="tab-record" class="tab-content space-y-5">
            <!-- 類型切換頁籤 (僅保留 支出 / 收入) -->
            <div class="bg-muji-card p-1.5 rounded-2xl border border-muji-border flex justify-between space-x-1.5 shadow-sm">
                <button type="button" onclick="setType('expense')" id="btn-type-expense"
                    class="flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 bg-muji-expenseBg text-muji-expense shadow-sm font-semibold">
                    <i class="fa-solid fa-minus text-xs"></i>
                    <span>支出</span>
                </button>
                <button type="button" onclick="setType('income')" id="btn-type-income"
                    class="flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 text-muji-muted hover:text-muji-dark">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>收入</span>
                </button>
            </div>

            <!-- 輸入表單卡片 -->
            <form id="recordForm" onsubmit="saveRecord(event)" class="bg-muji-card p-6 rounded-3xl border border-muji-border shadow-sm space-y-5">
                
                <!-- 日期選擇 -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-muji-muted block">記帳日期</label>
                    <div class="relative">
                        <input type="date" id="inputDate" required
                            class="w-full bg-muji-bg border border-muji-border rounded-xl px-4 py-3 text-sm text-muji-dark focus:outline-none focus:ring-2 focus:ring-muji-accent/50 transition">
                    </div>
                </div>

                <!-- 金額輸入 -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-muji-muted block">交易金額 (NT$)</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-lg font-semibold text-muji-muted">$</span>
                        <input type="number" id="inputAmount" min="1" step="any" placeholder="0" required
                            class="w-full bg-muji-bg border border-muji-border rounded-xl pl-9 pr-4 py-3 text-xl font-semibold text-muji-dark focus:outline-none focus:ring-2 focus:ring-muji-accent/50 transition">
                    </div>
                </div>

                <!-- 分類選擇 -->
                <div class="space-y-2">
                    <label class="text-xs font-medium text-muji-muted block">選擇分類</label>
                    <div id="categoryContainer" class="grid grid-cols-4 gap-2"></div>
                </div>

                <!-- 支出細項 / 備註 -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-muji-muted block">備註細項</label>
                    <input type="text" id="inputNote" placeholder="例如：早餐便當、水電費單..."
                        class="w-full bg-muji-bg border border-muji-border rounded-xl px-4 py-3 text-sm text-muji-dark focus:outline-none focus:ring-2 focus:ring-muji-accent/50 transition">
                </div>

                <!-- 儲存按鈕 -->
                <button type="submit"
                    class="w-full bg-muji-dark hover:bg-black text-white font-medium py-3.5 rounded-2xl shadow-sm transition active:scale-[0.99] flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-check text-xs"></i>
                    <span>儲存這筆記帳</span>
                </button>
            </form>
        </section>

        <!-- ===== 分頁 2: 明細列表 ===== -->
        <section id="tab-list" class="tab-content hidden space-y-4">
            <div class="flex items-center justify-between space-x-2 bg-muji-card p-3 rounded-2xl border border-muji-border shadow-sm">
                <div class="flex items-center space-x-2 flex-1">
                    <i class="fa-solid fa-filter text-muji-muted text-xs pl-2"></i>
                    <select id="filterMonth" onchange="renderList()"
                        class="bg-transparent text-sm font-medium text-muji-dark focus:outline-none w-full">
                    </select>
                </div>
                <div class="text-xs text-muji-muted font-medium pr-2" id="listCount">
                    共 0 筆
                </div>
            </div>

            <div id="transactionList" class="space-y-3"></div>
        </section>

        <!-- ===== 分頁 3: 每月總結 ===== -->
        <section id="tab-summary" class="tab-content hidden space-y-5">
            <div class="flex justify-between items-center bg-muji-card p-4 rounded-2xl border border-muji-border shadow-sm">
                <button onclick="changeSummaryMonth(-1)" class="w-8 h-8 rounded-full bg-muji-bg border border-muji-border text-muji-dark flex items-center justify-center hover:bg-muji-border/40">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <div id="summaryMonthTitle" class="text-base font-bold text-muji-dark">
                    ---- 年 -- 月
                </div>
                <button onclick="changeSummaryMonth(1)" class="w-8 h-8 rounded-full bg-muji-bg border border-muji-border text-muji-dark flex items-center justify-center hover:bg-muji-border/40">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-muji-incomeBg/60 p-4 rounded-2xl border border-muji-income/20 space-y-1">
                    <span class="text-xs font-medium text-muji-income flex items-center gap-1">
                        <i class="fa-solid fa-circle-arrow-down text-[10px]"></i> 當月總收入
                    </span>
                    <div id="sumIncome" class="text-lg font-bold text-muji-income">NT$ 0</div>
                </div>
                <div class="bg-muji-expenseBg/60 p-4 rounded-2xl border border-muji-expense/20 space-y-1">
                    <span class="text-xs font-medium text-muji-expense flex items-center gap-1">
                        <i class="fa-solid fa-circle-arrow-up text-[10px]"></i> 當月總支出
                    </span>
                    <div id="sumExpense" class="text-lg font-bold text-muji-expense">NT$ 0</div>
                </div>
            </div>

            <div class="bg-muji-card p-5 rounded-3xl border border-muji-border shadow-sm space-y-2 text-center">
                <span class="text-xs font-medium text-muji-muted">當月剩餘 / 結餘 (收入 - 支出)</span>
                <div id="sumNetBalance" class="text-3xl font-extrabold text-muji-dark">
                    NT$ 0
                </div>
                <div id="balanceStatusText" class="text-xs text-muji-muted pt-1">
                    財務狀況良好
                </div>
            </div>

            <div class="bg-muji-card p-5 rounded-3xl border border-muji-border shadow-sm space-y-4">
                <h3 class="text-xs font-bold text-muji-dark tracking-wide uppercase flex items-center justify-between">
                    <span>支出分類排行榜</span>
                    <i class="fa-solid fa-chart-pie text-muji-muted"></i>
                </h3>
                <div id="categoryBreakdown" class="space-y-3"></div>
            </div>
        </section>

        <!-- ===== 分頁 4: 匯出與設定 ===== -->
        <section id="tab-settings" class="tab-content hidden space-y-4">
            <div class="bg-muji-card p-5 rounded-3xl border border-muji-border shadow-sm space-y-4">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center border border-emerald-100">
                        <i class="fa-solid fa-file-excel text-lg"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-muji-dark">匯出 Excel 報表</h3>
                        <p class="text-xs text-muji-muted">自由選擇指定月份或全部紀錄匯出</p>
                    </div>
                </div>

                <div class="space-y-1.5 pt-1">
                    <label class="text-xs font-medium text-muji-muted block">選擇匯出範圍 / 月份</label>
                    <select id="exportMonthSelect" class="w-full bg-muji-bg border border-muji-border rounded-xl px-4 py-3 text-sm font-medium text-muji-dark focus:outline-none focus:ring-2 focus:ring-muji-accent/50 transition">
                    </select>
                </div>

                <button onclick="exportToExcel()"
                    class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-3 rounded-xl shadow-sm transition active:scale-[0.99] flex items-center justify-center space-x-2 text-sm">
                    <i class="fa-solid fa-download text-xs"></i>
                    <span>匯出指定月份報表 (.xlsx)</span>
                </button>
            </div>

            <div class="bg-muji-card p-5 rounded-3xl border border-muji-border shadow-sm space-y-3">
                <h3 class="text-xs font-bold text-muji-dark tracking-wide">資料庫管理 (LocalStorage)</h3>
                <p class="text-xs text-muji-muted leading-relaxed">
                    所有記帳資料均妥善儲存於手機區域記憶體中。清除後將無法復原。
                </p>
                <div class="pt-2 flex flex-col space-y-2">
                    <button onclick="loadSampleData()"
                        class="w-full bg-muji-bg hover:bg-muji-border/40 text-muji-dark font-medium py-2.5 rounded-xl border border-muji-border text-xs transition">
                        填入示範記帳資料
                    </button>
                    <button onclick="clearAllData()"
                        class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-medium py-2.5 rounded-xl border border-red-100 text-xs transition">
                        清除所有本機資料
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- 底部導航列 -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-muji-card/90 backdrop-blur-md border-t border-muji-border px-6 py-2.5 z-40 flex justify-between items-center">
        <button onclick="switchTab('record')" id="nav-record" class="nav-btn flex flex-col items-center space-y-1 text-muji-dark font-bold">
            <i class="fa-solid fa-pen-to-square text-lg"></i>
            <span class="text-[10px] font-medium">記帳</span>
        </button>
        <button onclick="switchTab('list')" id="nav-list" class="nav-btn flex flex-col items-center space-y-1 text-muji-muted hover:text-muji-dark">
            <i class="fa-solid fa-list-ul text-lg"></i>
            <span class="text-[10px] font-medium">明細</span>
        </button>
        <button onclick="switchTab('summary')" id="nav-summary" class="nav-btn flex flex-col items-center space-y-1 text-muji-muted hover:text-muji-dark">
            <i class="fa-solid fa-chart-simple text-lg"></i>
            <span class="text-[10px] font-medium">總結</span>
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center space-y-1 text-muji-muted hover:text-muji-dark">
            <i class="fa-solid fa-gear text-lg"></i>
            <span class="text-[10px] font-medium">設定</span>
        </button>
    </nav>

    <!-- 吐司通知提示 -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-muji-dark text-white text-xs py-2.5 px-5 rounded-full shadow-lg transition-all opacity-0 pointer-events-none duration-300 z-50 flex items-center space-x-2">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">操作成功</span>
    </div>

    <!-- JavaScript 邏輯引擎 -->
    <script>
        const categories = {
            expense: ['零用金', '薪資支出', '雜項', '稅金', '水電費', '勞健保', '電話費', '其他'],
            income: ['薪資收入', '兼職所得', '投資理財', '零用金/紅包', '其他']
        };

        const categoryIcons = {
            '零用金': 'fa-wallet',
            '薪資支出': 'fa-money-check-dollar',
            '雜項': 'fa-box-archive',
            '稅金': 'fa-file-invoice-dollar',
            '水電費': 'fa-bolt',
            '勞健保': 'fa-notes-medical',
            '電話費': 'fa-mobile-screen-button',
            '其他': 'fa-ellipsis',
            '薪資收入': 'fa-sack-dollar',
            '兼職所得': 'fa-briefcase',
            '投資理財': 'fa-chart-line',
            '零用金/紅包': 'fa-gift'
        };

        let currentType = 'expense';
        let selectedCategory = '零用金';
        let summaryYearMonth = new Date().toISOString().slice(0, 7);

        // 動態生成日系無印極簡風手帳/記帳本圖示 (180x180 px PNG Data URI)
        function generateHighResAppleTouchIcon() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 180;
                canvas.height = 180;
                const ctx = canvas.getContext('2d');

                // 1. 底圖卡片 (奶油暖白 Warm Cream #FAF7F2)
                ctx.fillStyle = '#FAF7F2';
                ctx.beginPath();
                ctx.roundRect(0, 0, 180, 180, 40);
                ctx.fill();

                // 2. 筆記本卡片 (Pure White Card)
                ctx.fillStyle = '#FFFFFF';
                ctx.strokeStyle = '#EFECE6';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.roundRect(16, 16, 148, 148, 24);
                ctx.fill();
                ctx.stroke();

                // 3. 筆記本皮革書脊 (Oat Milk Spine #D4C3AC)
                ctx.fillStyle = '#D4C3AC';
                ctx.fillRect(28, 16, 22, 148);

                // 4. 活頁線圈質感點點 (Ring Binder Holes)
                ctx.fillStyle = '#3B3632';
                [38, 68, 98, 128].forEach(y => {
                    ctx.beginPath();
                    ctx.arc(39, y, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 5. 莫蘭迪陶土紅經典書籤絲帶 (Terracotta Red Bookmark Ribbon)
                ctx.fillStyle = '#C05A46';
                ctx.beginPath();
                ctx.moveTo(122, 16);
                ctx.lineTo(122, 54);
                ctx.lineTo(113, 45);
                ctx.lineTo(104, 54);
                ctx.lineTo(104, 16);
                ctx.closePath();
                ctx.fill();

                // 6. 記帳手帳封面邊框與內部書頁設計 (Notebook / Ledger Cover Icon)
                ctx.strokeStyle = '#3B3632';
                ctx.lineWidth = 5.5;
                ctx.lineJoin = 'round';
                ctx.strokeRect(68, 54, 48, 70);

                // 中間摺頁線
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.moveTo(82, 54);
                ctx.lineTo(82, 124);
                ctx.stroke();

                // 記帳筆記本橫線 (Notebook Ledger Lines)
                ctx.strokeStyle = '#8C827A';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                [72, 86, 100, 112].forEach(y => {
                    ctx.beginPath();
                    ctx.moveTo(92, y);
                    ctx.lineTo(108, y);
                    ctx.stroke();
                });

                // 轉為 180x180 高畫質 PNG Data URL
                const pngDataUrl = canvas.toDataURL('image/png');
                const appleIconTag = document.getElementById('appleTouchIcon');
                const faviconTag = document.getElementById('faviconIcon');
                if (appleIconTag) appleIconTag.href = pngDataUrl;
                if (faviconTag) faviconTag.href = pngDataUrl;
            } catch (err) {
                console.log("Canvas icon rendering fallback", err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            generateHighResAppleTouchIcon();
            document.getElementById('inputDate').valueAsDate = new Date();
            updateHeaderMonth();
            renderCategories();
            renderList();
            renderSummary();
            updateExportMonthOptions();
        });

        function getRecords() {
            const data = localStorage.getItem('muji_accounting_records');
            return data ? JSON.parse(data) : [];
        }

        function saveRecordsToStorage(records) {
            localStorage.setItem('muji_accounting_records', JSON.stringify(records));
        }

        function setType(type) {
            currentType = type;
            const btnExpense = document.getElementById('btn-type-expense');
            const btnIncome = document.getElementById('btn-type-income');

            [btnExpense, btnIncome].forEach(btn => {
                btn.className = "flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 text-muji-muted hover:text-muji-dark";
            });

            if (type === 'expense') {
                btnExpense.className = "flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 bg-muji-expenseBg text-muji-expense shadow-sm font-semibold";
            } else if (type === 'income') {
                btnIncome.className = "flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 bg-muji-incomeBg text-muji-income shadow-sm font-semibold";
            }

            selectedCategory = categories[type];
            renderCategories();
        }

        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            container.innerHTML = '';
            
            categories[currentType].forEach(cat => {
                const isSelected = cat === selectedCategory;
                const icon = categoryIcons[cat] || 'fa-tag';
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => {
                    selectedCategory = cat;
                    renderCategories();
                };
                
                btn.className = `p-2.5 rounded-xl text-xs flex flex-col items-center justify-center space-y-1 transition border ${
                    isSelected 
                        ? 'bg-muji-dark text-white border-muji-dark shadow-sm font-medium' 
                        : 'bg-muji-bg text-muji-dark border-muji-border hover:bg-muji-border/30'
                }`;

                btn.innerHTML = `
                    <i class="fa-solid ${icon} text-sm"></i>
                    <span class="truncate w-full text-center">${cat}</span>
                `;
                container.appendChild(btn);
            });
        }

        function saveRecord(e) {
            e.preventDefault();
            const date = document.getElementById('inputDate').value;
            const amount = parseFloat(document.getElementById('inputAmount').value);
            const note = document.getElementById('inputNote').value.trim();

            if (!date || isNaN(amount) || amount <= 0) {
                showToast('請輸入正確的日期與金額', 'fa-circle-exclamation');
                return;
            }

            const newRecord = {
                id: Date.now().toString(),
                date,
                type: currentType,
                category: selectedCategory,
                amount,
                note
            };

            const records = getRecords();
            records.unshift(newRecord);
            saveRecordsToStorage(records);

            document.getElementById('inputAmount').value = '';
            document.getElementById('inputNote').value = '';
            
            showToast('記帳成功保存！');
            renderList();
            renderSummary();
            updateExportMonthOptions();
            switchTab('list');
        }

        function renderList() {
            const records = getRecords();
            const listContainer = document.getElementById('transactionList');
            const filterMonthSelect = document.getElementById('filterMonth');

            const months = [...new Set(records.map(r => r.date.slice(0, 7)))].sort().reverse();
            if (months.length === 0) {
                const nowYM = new Date().toISOString().slice(0, 7);
                months.push(nowYM);
            }

            filterMonthSelect.innerHTML = months.map(m => 
                `<option value="${m}">${m.replace('-', ' 年 ')} 月</option>`
            ).join('');

            const selectedMonth = filterMonthSelect.value || months;
            const filteredRecords = records.filter(r => r.date.startsWith(selectedMonth));

            document.getElementById('listCount').innerText = `共 ${filteredRecords.length} 筆`;

            if (filteredRecords.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-muji-card p-8 rounded-3xl border border-muji-border text-center space-y-2">
                        <i class="fa-solid fa-receipt text-3xl text-muji-muted/40"></i>
                        <p class="text-xs text-muji-muted">這個月還沒有任何記帳紀錄喔</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = filteredRecords.map(r => {
                let badgeStyle = "bg-muji-expenseBg text-muji-expense";
                let amountPrefix = "-";
                if (r.type === 'income') {
                    badgeStyle = "bg-muji-incomeBg text-muji-income";
                    amountPrefix = "+";
                }

                const icon = categoryIcons[r.category] || 'fa-tag';

                return `
                    <div class="bg-muji-card p-4 rounded-2xl border border-muji-border shadow-sm flex items-center justify-between hover:border-muji-accent/50 transition">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl ${badgeStyle} flex items-center justify-center">
                                <i class="fa-solid ${icon} text-sm"></i>
                            </div>
                            <div>
                                <div class="flex items-center space-x-1.5">
                                    <span class="text-sm font-bold text-muji-dark">${r.category}</span>
                                    <span class="text-[10px] text-muji-muted">${r.date}</span>
                                </div>
                                <p class="text-xs text-muji-muted truncate max-w-[140px]">${r.note || '無備註'}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-base font-bold ${r.type === 'income' ? 'text-muji-income' : 'text-muji-expense'}">
                                ${amountPrefix}$${r.amount.toLocaleString()}
                            </span>
                            <button onclick="deleteRecord('${r.id}')" class="text-muji-border hover:text-red-400 transition p-1">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function deleteRecord(id) {
            if (confirm('確定要刪除這筆記帳紀錄嗎？')) {
                let records = getRecords();
                records = records.filter(r => r.id !== id);
                saveRecordsToStorage(records);
                showToast('已刪除紀錄');
                renderList();
                renderSummary();
                updateExportMonthOptions();
            }
        }

        function renderSummary() {
            const records = getRecords();
            const monthRecords = records.filter(r => r.date.startsWith(summaryYearMonth));

            document.getElementById('summaryMonthTitle').innerText = summaryYearMonth.replace('-', ' 年 ') + ' 月';

            let totalIncome = 0;
            let totalExpense = 0;
            const categorySums = {};

            monthRecords.forEach(r => {
                if (r.type === 'income') {
                    totalIncome += r.amount;
                } else if (r.type === 'expense') {
                    totalExpense += r.amount;
                    categorySums[r.category] = (categorySums[r.category] || 0) + r.amount;
                }
            });

            const netBalance = totalIncome - totalExpense;

            document.getElementById('sumIncome').innerText = `NT$ ${totalIncome.toLocaleString()}`;
            document.getElementById('sumExpense').innerText = `NT$ ${totalExpense.toLocaleString()}`;
            
            const netElem = document.getElementById('sumNetBalance');
            netElem.innerText = `NT$ ${netBalance.toLocaleString()}`;
            netElem.className = `text-3xl font-extrabold ${netBalance >= 0 ? 'text-muji-dark' : 'text-muji-expense'}`;

            document.getElementById('balanceStatusText').innerText = netBalance >= 0 ? '財務狀況健康，繼續保持！' : '本月支出已超出收入，請注意開支。';

            const breakdownContainer = document.getElementById('categoryBreakdown');
            const sortedCategories = Object.entries(categorySums).sort((a, b) => b - a);

            if (sortedCategories.length === 0) {
                breakdownContainer.innerHTML = `<p class="text-xs text-muji-muted text-center py-2">本月尚無支出分類數據</p>`;
                return;
            }

            breakdownContainer.innerHTML = sortedCategories.map(([cat, sum]) => {
                const percent = totalExpense > 0 ? ((sum / totalExpense) * 100).toFixed(1) : 0;
                return `
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs text-muji-dark">
                            <span class="font-medium">${cat}</span>
                            <span class="text-muji-muted">$${sum.toLocaleString()} (${percent}%)</span>
                        </div>
                        <div class="w-full h-2 bg-muji-bg rounded-full overflow-hidden border border-muji-border/50">
                            <div class="h-full bg-muji-expense/80 rounded-full" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function changeSummaryMonth(offset) {
            const [y, m] = summaryYearMonth.split('-').map(Number);
            const date = new Date(y, m - 1 + offset, 1);
            summaryYearMonth = date.toISOString().slice(0, 7);
            renderSummary();
        }

        function updateExportMonthOptions() {
            const records = getRecords();
            const exportSelect = document.getElementById('exportMonthSelect');
            if (!exportSelect) return;

            const months = [...new Set(records.map(r => r.date.slice(0, 7)))].sort().reverse();
            const nowYM = new Date().toISOString().slice(0, 7);
            if (!months.includes(nowYM)) {
                months.unshift(nowYM);
            }

            exportSelect.innerHTML = `<option value="ALL">全部歷史紀錄 (跨月)</option>` + 
                months.map(m => `<option value="${m}">${m.replace('-', ' 年 ')} 月</option>`).join('');
        }

        function exportToExcel() {
            const records = getRecords();
            if (records.length === 0) {
                showToast('目前沒有可供匯出的資料', 'fa-circle-exclamation');
                return;
            }

            const selectedMonth = document.getElementById('exportMonthSelect').value;
            let targetRecords = records;
            let periodTitle = "全部月份";

            if (selectedMonth !== 'ALL') {
                targetRecords = records.filter(r => r.date.startsWith(selectedMonth));
                periodTitle = selectedMonth.replace('-', '年') + '月';
            }

            if (targetRecords.length === 0) {
                showToast('選取的月份目前沒有記帳紀錄', 'fa-circle-exclamation');
                return;
            }

            let totalIncome = 0;
            let totalExpense = 0;

            const exportData = targetRecords.map((r, index) => {
                if (r.type === 'income') totalIncome += r.amount;
                if (r.type === 'expense') totalExpense += r.amount;

                return {
                    '序號': index + 1,
                    '日期': r.date,
                    '類型': r.type === 'income' ? '收入' : '支出',
                    '分類': r.category,
                    '金額 (NT\$)': r.amount,
                    '備註/細項': r.note || ''
                };
            });

            const netBalance = totalIncome - totalExpense;

            exportData.push({});
            exportData.push({
                '序號': `【${periodTitle} 統計總結】`,
                '日期': '',
                '類型': '',
                '分類': '當期總收入',
                '金額 (NT\$)': totalIncome,
                '備註/細項': ''
            });
            exportData.push({
                '序號': '',
                '日期': '',
                '類型': '',
                '分類': '當期總支出',
                '金額 (NT\$)': totalExpense,
                '備註/細項': ''
            });
            exportData.push({
                '序號': '',
                '日期': '',
                '類型': '',
                '分類': '結餘 (收入 - 支出)',
                '金額 (NT\$)': netBalance,
                '備註/細項': netBalance >= 0 ? '財務狀況健康' : '支出超出收入'
            });

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, `${periodTitle}結餘報表`);

            worksheet['!cols'] = [{ wch: 20 }, { wch: 12 }, { wch: 8 }, { wch: 18 }, { wch: 14 }, { wch: 24 }];

            const fileName = `極簡記帳_${periodTitle}_明細與結餘總表_${new Date().toISOString().slice(0, 10)}.xlsx`;
            XLSX.writeFile(workbook, fileName);
            showToast(`已成功匯出 ${periodTitle} Excel 報表！`);
        }

        function loadSampleData() {
            if (confirm('是否載入測試記帳資料？')) {
                const sample = [
                    { id: '1', date: new Date().toISOString().slice(0, 10), type: 'expense', category: '零用金', amount: 120, note: '早餐便當' },
                    { id: '2', date: new Date().toISOString().slice(0, 10), type: 'expense', category: '水電費', amount: 850, note: '水電費單' },
                    { id: '3', date: new Date().toISOString().slice(0, 10), type: 'income', category: '薪資收入', amount: 45000, note: '十月薪水' },
                    { id: '4', date: new Date().toISOString().slice(0, 10), type: 'expense', category: '電話費', amount: 599, note: '月租費' }
                ];
                saveRecordsToStorage(sample);
                showToast('示範資料載入完成');
                renderList();
                renderSummary();
                updateExportMonthOptions();
            }
        }

        function clearAllData() {
            if (confirm('確定要清除所有本機記帳紀錄嗎？此動作無法復原！')) {
                localStorage.removeItem('muji_accounting_records');
                showToast('資料已全數清空');
                renderList();
                renderSummary();
                updateExportMonthOptions();
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = "nav-btn flex flex-col items-center space-y-1 text-muji-muted hover:text-muji-dark";
            });
            document.getElementById(`nav-${tabId}`).className = "nav-btn flex flex-col items-center space-y-1 text-muji-dark font-bold";

            if (tabId === 'settings') {
                updateExportMonthOptions();
            }
        }

        function updateHeaderMonth() {
            const now = new Date();
            document.getElementById('headerMonth').innerText = `${now.getFullYear()} 年 ${now.getMonth() + 1} 月`;
        }

        function showToast(msg, icon = 'fa-circle-check') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').className = `fa-solid ${icon} text-emerald-400`;
            
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }
    </script>
</body>
</html>
