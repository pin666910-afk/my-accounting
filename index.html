<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>無印風極簡記帳</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS CDN (Excel 匯出套件) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts: Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        muji: {
                            bg: '#FAF7F2',        // 奶油暖白底色
                            card: '#FFFFFF',      // 純白卡片
                            border: '#EFECE6',    // 柔和質感邊框
                            dark: '#3B3632',      // 暖炭灰文字
                            muted: '#8C827A',     // 莫蘭迪次要文字
                            accent: '#D4C3AC',    // 燕麥奶大地色
                            income: '#4E7A62',    // 鼠尾草綠 (收入)
                            incomeBg: '#EAF2ED',
                            expense: '#C05A46',   // 陶土紅 (支出)
                            expenseBg: '#FDF0EE'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAF7F2;
            color: #3B3632;
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen max-w-md mx-auto relative shadow-md bg-muji-bg flex flex-col justify-between pb-24 border-x border-muji-border/60">

    <!-- 頂部標題列 -->
    <header class="bg-muji-card/80 backdrop-blur-md sticky top-0 z-30 px-6 py-4 border-b border-muji-border flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-muji-accent/30 flex items-center justify-center text-muji-dark">
                <i class="fa-solid font-bold fa-book-open text-xs"></i>
            </div>
            <h1 class="text-lg font-bold tracking-wide text-muji-dark">無印極簡記帳</h1>
        </div>
        <span id="headerMonth" class="text-xs font-medium text-muji-muted bg-muji-bg px-3 py-1 rounded-full border border-muji-border">
            -- 年 -- 月
        </span>
    </header>

    <!-- 主體內容分頁 container -->
    <main class="flex-1 p-5 space-y-5">

        <!-- ===== 分頁 1: 記帳輸入 ===== -->
        <section id="tab-record" class="tab-content space-y-5">
            <!-- 類型切換頁籤 (僅保留 支出 / 收入) -->
            <div class="bg-muji-card p-1.5 rounded-2xl border border-muji-border flex justify-between space-x-1.5 shadow-sm">
                <button type="button" onclick="setType('expense')" id="btn-type-expense"
                    class="flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 bg-muji-expenseBg text-muji-expense shadow-sm font-semibold">
                    <i class="fa-solid fa-minus text-xs"></i>
                    <span>支出</span>
                </button>
                <button type="button" onclick="setType('income')" id="btn-type-income"
                    class="flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 text-muji-muted hover:text-muji-dark">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>收入</span>
                </button>
            </div>

            <!-- 輸入表單卡片 -->
            <form id="recordForm" onsubmit="saveRecord(event)" class="bg-muji-card p-6 rounded-3xl border border-muji-border shadow-sm space-y-5">
                
                <!-- 日期選擇 -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-muji-muted block">記帳日期</label>
                    <div class="relative">
                        <input type="date" id="inputDate" required
                            class="w-full bg-muji-bg border border-muji-border rounded-xl px-4 py-3 text-sm text-muji-dark focus:outline-none focus:ring-2 focus:ring-muji-accent/50 transition">
                    </div>
                </div>

                <!-- 金額輸入 -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-muji-muted block">交易金額 (NT$)</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-lg font-semibold text-muji-muted">$</span>
                        <input type="number" id="inputAmount" min="1" step="any" placeholder="0" required
                            class="w-full bg-muji-bg border border-muji-border rounded-xl pl-9 pr-4 py-3 text-xl font-semibold text-muji-dark focus:outline-none focus:ring-2 focus:ring-muji-accent/50 transition">
                    </div>
                </div>

                <!-- 分類選擇與自訂按鈕 -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-medium text-muji-muted block">選擇分類</label>
                        <div class="space-x-2">
                            <button type="button" onclick="openAddCategoryModal()" class="text-[11px] text-muji-muted hover:text-muji-dark underline">
                                + 新增分類
                            </button>
                            <button type="button" onclick="openManageCategoryModal()" class="text-[11px] text-muji-muted hover:text-muji-dark underline">
                                管理分類
                            </button>
                        </div>
                    </div>
                    <div id="categoryContainer" class="grid grid-cols-4 gap-2"></div>
                </div>

                <!-- 支出細項 / 備註 -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-muji-muted block">備註細項</label>
                    <input type="text" id="inputNote" placeholder="例如：早餐便當、水電費單..."
                        class="w-full bg-muji-bg border border-muji-border rounded-xl px-4 py-3 text-sm text-muji-dark focus:outline-none focus:ring-2 focus:ring-muji-accent/50 transition">
                </div>

                <!-- 儲存按鈕 -->
                <button type="submit"
                    class="w-full bg-muji-dark hover:bg-black text-white font-medium py-3.5 rounded-2xl shadow-sm transition active:scale-[0.99] flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-check text-xs"></i>
                    <span>儲存這筆記帳</span>
                </button>
            </form>
        </section>

        <!-- ===== 分頁 2: 明細列表 ===== -->
        <section id="tab-list" class="tab-content hidden space-y-4">
            <div class="flex items-center justify-between space-x-2 bg-muji-card p-3 rounded-2xl border border-muji-border shadow-sm">
                <div class="flex items-center space-x-2 flex-1">
                    <i class="fa-solid fa-filter text-muji-muted text-xs pl-2"></i>
                    <select id="filterMonth" onchange="renderList()"
                        class="bg-transparent text-sm font-medium text-muji-dark focus:outline-none w-full cursor-pointer">
                    </select>
                </div>
                <div class="text-xs text-muji-muted font-medium pr-2" id="listCount">
                    共 0 筆
                </div>
            </div>

            <div id="transactionList" class="space-y-3"></div>
        </section>

        <!-- ===== 分頁 3: 每月總結 ===== -->
        <section id="tab-summary" class="tab-content hidden space-y-5">
            <div class="flex justify-between items-center bg-muji-card p-4 rounded-2xl border border-muji-border shadow-sm">
                <button onclick="changeSummaryMonth(-1)" class="w-8 h-8 rounded-full bg-muji-bg border border-muji-border text-muji-dark flex items-center justify-center hover:bg-muji-border/40">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <div class="flex items-center space-x-1">
                    <select id="summaryMonthSelect" onchange="onSummaryMonthSelectChange()" class="bg-transparent text-base font-bold text-muji-dark focus:outline-none text-center cursor-pointer">
                    </select>
                </div>
                <button onclick="changeSummaryMonth(1)" class="w-8 h-8 rounded-full bg-muji-bg border border-muji-border text-muji-dark flex items-center justify-center hover:bg-muji-border/40">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-muji-incomeBg/60 p-4 rounded-2xl border border-muji-income/20 space-y-1">
                    <span class="text-xs font-medium text-muji-income flex items-center gap-1">
                        <i class="fa-solid fa-circle-arrow-down text-[10px]"></i> 當月總收入
                    </span>
                    <div id="sumIncome" class="text-lg font-bold text-muji-income">NT$ 0</div>
                </div>
                <div class="bg-muji-expenseBg/60 p-4 rounded-2xl border border-muji-expense/20 space-y-1">
                    <span class="text-xs font-medium text-muji-expense flex items-center gap-1">
                        <i class="fa-solid fa-circle-arrow-up text-[10px]"></i> 當月總支出
                    </span>
                    <div id="sumExpense" class="text-lg font-bold text-muji-expense">NT$ 0</div>
                </div>
            </div>

            <div class="bg-muji-card p-5 rounded-3xl border border-muji-border shadow-sm space-y-2 text-center">
                <span class="text-xs font-medium text-muji-muted">當月剩餘 / 結餘 (收入 - 支出)</span>
                <div id="sumNetBalance" class="text-3xl font-extrabold text-muji-dark">
                    NT$ 0
                </div>
                <div id="balanceStatusText" class="text-xs text-muji-muted pt-1">
                    財務狀況良好
                </div>
            </div>

            <div class="bg-muji-card p-5 rounded-3xl border border-muji-border shadow-sm space-y-4">
                <h3 class="text-xs font-bold text-muji-dark tracking-wide uppercase flex items-center justify-between">
                    <span>支出分類排行榜</span>
                    <i class="fa-solid fa-chart-pie text-muji-muted"></i>
                </h3>
                <div id="categoryBreakdown" class="space-y-3"></div>
            </div>
        </section>

        <!-- ===== 分頁 4: 匯出與設定 ===== -->
        <section id="tab-settings" class="tab-content hidden space-y-4">
            <!-- Excel 匯出專區 -->
            <div class="bg-muji-card p-5 rounded-3xl border border-muji-border shadow-sm space-y-4">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center border border-emerald-100">
                        <i class="fa-solid fa-file-excel text-lg"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-muji-dark">匯出 Excel 報表</h3>
                        <p class="text-xs text-muji-muted">自由選擇指定月份或全部紀錄匯出</p>
                    </div>
                </div>

                <div class="space-y-1.5 pt-1">
                    <label class="text-xs font-medium text-muji-muted block">選擇匯出範圍 / 月份</label>
                    <select id="exportMonthSelect" class="w-full bg-muji-bg border border-muji-border rounded-xl px-4 py-3 text-sm font-medium text-muji-dark focus:outline-none focus:ring-2 focus:ring-muji-accent/50 transition cursor-pointer">
                    </select>
                </div>

                <button type="button" onclick="exportToExcel()"
                    class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-3 rounded-xl shadow-sm transition active:scale-[0.99] flex items-center justify-center space-x-2 text-sm cursor-pointer">
                    <i class="fa-solid fa-download text-xs"></i>
                    <span>匯出指定月份報表 (.xlsx)</span>
                </button>
            </div>

            <!-- JSON 備份與還原 -->
            <div class="bg-muji-card p-5 rounded-3xl border border-muji-border shadow-sm space-y-3">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center border border-amber-100">
                        <i class="fa-solid fa-database text-lg"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-muji-dark">JSON 備份與還原</h3>
                        <p class="text-xs text-muji-muted">換手機或跨瀏覽器轉移完整備份檔</p>
                    </div>
                </div>
                <div class="pt-2 flex flex-col space-y-2">
                    <button type="button" onclick="backupJSON()"
                        class="w-full bg-muji-dark hover:bg-black text-white font-medium py-2.5 rounded-xl text-xs transition flex items-center justify-center space-x-1.5 cursor-pointer">
                        <i class="fa-solid fa-file-arrow-down"></i>
                        <span>備份/下載 JSON 檔案 (.json)</span>
                    </button>
                    <label class="w-full bg-muji-bg hover:bg-muji-border/40 text-muji-dark font-medium py-2.5 rounded-xl border border-muji-border text-xs transition text-center cursor-pointer flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-file-arrow-up"></i>
                        <span>還原 JSON 備份檔 (.json)</span>
                        <input type="file" id="jsonFileInput" accept=".json" onchange="restoreJSON(event)" class="hidden">
                    </label>
                </div>
            </div>

            <!-- 資料庫管理 -->
            <div class="bg-muji-card p-5 rounded-3xl border border-muji-border shadow-sm space-y-3">
                <h3 class="text-xs font-bold text-muji-dark tracking-wide">資料庫管理 (LocalStorage)</h3>
                <p class="text-xs text-muji-muted leading-relaxed">
                    所有記帳資料均妥善儲存於手機區域記憶體中。清除後將無法復原。
                </p>
                <div class="pt-2 flex flex-col space-y-2">
                    <button type="button" onclick="clearAllData()"
                        class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-medium py-2.5 rounded-xl border border-red-100 text-xs transition cursor-pointer">
                        清除所有本機資料
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- 彈出視窗：新增自訂分類 -->
    <div id="addCategoryModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-muji-card rounded-3xl p-6 w-full max-w-xs space-y-4 border border-muji-border shadow-xl">
            <h3 class="text-sm font-bold text-muji-dark">新增自訂分類</h3>
            <input type="text" id="newCatName" placeholder="輸入分類名稱 (例如: 寵物, 健身)" class="w-full bg-muji-bg border border-muji-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-muji-accent">
            <div class="flex justify-end space-x-2">
                <button type="button" onclick="closeAddCategoryModal()" class="px-4 py-2 text-xs font-medium text-muji-muted hover:text-muji-dark">取消</button>
                <button type="button" onclick="saveNewCategory()" class="px-4 py-2 bg-muji-dark text-white rounded-xl text-xs font-medium">新增</button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗：管理自訂分類 -->
    <div id="manageCategoryModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-muji-card rounded-3xl p-6 w-full max-w-xs space-y-4 border border-muji-border shadow-xl max-h-[80vh] flex flex-col">
            <h3 class="text-sm font-bold text-muji-dark">管理自訂分類</h3>
            <div id="manageCategoryList" class="flex-1 overflow-y-auto space-y-2 pr-1 no-scrollbar"></div>
            <div class="flex justify-end pt-2">
                <button type="button" onclick="closeManageCategoryModal()" class="px-4 py-2 bg-muji-dark text-white rounded-xl text-xs font-medium">完成</button>
            </div>
        </div>
    </div>

    <!-- 底部導航列 -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-muji-card/90 backdrop-blur-md border-t border-muji-border px-6 py-2.5 z-40 flex justify-between items-center">
        <button type="button" onclick="switchTab('record')" id="nav-record" class="nav-btn flex flex-col items-center space-y-1 text-muji-dark font-bold cursor-pointer">
            <i class="fa-solid fa-pen-to-square text-lg pointer-events-none"></i>
            <span class="text-[10px] font-medium pointer-events-none">記帳</span>
        </button>
        <button type="button" onclick="switchTab('list')" id="nav-list" class="nav-btn flex flex-col items-center space-y-1 text-muji-muted hover:text-muji-dark cursor-pointer">
            <i class="fa-solid fa-list-ul text-lg pointer-events-none"></i>
            <span class="text-[10px] font-medium pointer-events-none">明細</span>
        </button>
        <button type="button" onclick="switchTab('summary')" id="nav-summary" class="nav-btn flex flex-col items-center space-y-1 text-muji-muted hover:text-muji-dark cursor-pointer">
            <i class="fa-solid fa-chart-simple text-lg pointer-events-none"></i>
            <span class="text-[10px] font-medium pointer-events-none">總結</span>
        </button>
        <button type="button" onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center space-y-1 text-muji-muted hover:text-muji-dark cursor-pointer">
            <i class="fa-solid fa-gear text-lg pointer-events-none"></i>
            <span class="text-[10px] font-medium pointer-events-none">設定</span>
        </button>
    </nav>

    <!-- 吐司通知提示 -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-muji-dark text-white text-xs py-2.5 px-5 rounded-full shadow-lg transition-all opacity-0 pointer-events-none duration-300 z-50 flex items-center space-x-2">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">操作成功</span>
    </div>

    <!-- JavaScript 邏輯引擎 -->
    <script>
        const defaultCategories = {
            expense: ['零用金', '薪資支出', '雜項', '稅金', '水電費', '勞健保', '電話費', '其他'],
            income: ['薪資收入', '兼職所得', '投資理財', '零用金/紅包', '其他']
        };

        const categoryIcons = {
            '零用金': 'fa-wallet',
            '薪資支出': 'fa-money-check-dollar',
            '雜項': 'fa-box-archive',
            '稅金': 'fa-file-invoice-dollar',
            '水電費': 'fa-bolt',
            '勞健保': 'fa-notes-medical',
            '電話費': 'fa-mobile-screen-button',
            '其他': 'fa-ellipsis',
            '薪資收入': 'fa-sack-dollar',
            '兼職所得': 'fa-briefcase',
            '投資理財': 'fa-chart-line',
            '零用金/紅包': 'fa-gift'
        };

        let currentType = 'expense';
        let selectedCategory = '零用金';
        let summaryYearMonth = new Date().toISOString().slice(0, 7);

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('inputDate');
            if (dateInput) {
                dateInput.valueAsDate = new Date();
            }
            updateHeaderMonth();
            renderCategories();
            updateAllMonthDropdowns();
            renderList();
            renderSummary();
        });

        // LocalStorage 管理
        function getRecords() {
            try {
                const data = localStorage.getItem('muji_accounting_records');
                return data ? JSON.parse(data) : [];
            } catch (err) {
                console.error("Error reading records from localStorage", err);
                return [];
            }
        }

        function saveRecordsToStorage(records) {
            try {
                localStorage.setItem('muji_accounting_records', JSON.stringify(records));
            } catch (err) {
                console.error("Error saving records to localStorage", err);
            }
        }

        function getCustomCategories() {
            try {
                const data = localStorage.getItem('muji_custom_categories');
                return data ? JSON.parse(data) : { expense: [], income: [] };
            } catch (err) {
                return { expense: [], income: [] };
            }
        }

        function saveCustomCategories(customs) {
            try {
                localStorage.setItem('muji_custom_categories', JSON.stringify(customs));
            } catch (err) {
                console.error("Error saving custom categories", err);
            }
        }

        // 取得融合後的完整分類
        function getActiveCategories(type) {
            const customs = getCustomCategories()[type] || [];
            return [...defaultCategories[type], ...customs];
        }

        // 切換類型 (支出 / 收入)
        function setType(type) {
            currentType = type;
            const btnExpense = document.getElementById('btn-type-expense');
            const btnIncome = document.getElementById('btn-type-income');

            if (btnExpense) btnExpense.className = "flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 text-muji-muted hover:text-muji-dark";
            if (btnIncome) btnIncome.className = "flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 text-muji-muted hover:text-muji-dark";

            if (type === 'expense' && btnExpense) {
                btnExpense.className = "flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 bg-muji-expenseBg text-muji-expense shadow-sm font-semibold";
            } else if (type === 'income' && btnIncome) {
                btnIncome.className = "flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 bg-muji-incomeBg text-muji-income shadow-sm font-semibold";
            }

            const activeCats = getActiveCategories(type);
            selectedCategory = activeCats[0] || '其他';
            renderCategories();
        }

        // 渲染分類按鈕
        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            if (!container) return;
            container.innerHTML = '';
            
            const activeCats = getActiveCategories(currentType);
            activeCats.forEach(cat => {
                const isSelected = cat === selectedCategory;
                const icon = categoryIcons[cat] || 'fa-tag';
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => {
                    selectedCategory = cat;
                    renderCategories();
                };
                
                btn.className = `p-2.5 rounded-xl text-xs flex flex-col items-center justify-center space-y-1 transition border cursor-pointer ${
                    isSelected 
                        ? 'bg-muji-dark text-white border-muji-dark shadow-sm font-medium' 
                        : 'bg-muji-bg text-muji-dark border-muji-border hover:bg-muji-border/30'
                }`;

                btn.innerHTML = `
                    <i class="fa-solid ${icon} text-sm pointer-events-none"></i>
                    <span class="truncate w-full text-center pointer-events-none">${cat}</span>
                `;
                container.appendChild(btn);
            });
        }

        // 新增與管理自訂分類視窗
        function openAddCategoryModal() {
            const input = document.getElementById('newCatName');
            if (input) input.value = '';
            const modal = document.getElementById('addCategoryModal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeAddCategoryModal() {
            const modal = document.getElementById('addCategoryModal');
            if (modal) modal.classList.add('hidden');
        }

        function saveNewCategory() {
            const nameEl = document.getElementById('newCatName');
            const name = nameEl ? nameEl.value.trim() : '';
            if (!name) {
                showToast('請輸入分類名稱', 'fa-circle-exclamation');
                return;
            }

            const customs = getCustomCategories();
            if (!customs[currentType]) customs[currentType] = [];
            
            const fullList = getActiveCategories(currentType);
            if (fullList.includes(name)) {
                showToast('此分類已存在', 'fa-circle-exclamation');
                return;
            }

            customs[currentType].push(name);
            saveCustomCategories(customs);
            selectedCategory = name;
            closeAddCategoryModal();
            renderCategories();
            showToast('已新增分類: ' + name);
        }

        function openManageCategoryModal() {
            const listEl = document.getElementById('manageCategoryList');
            if (!listEl) return;
            const customs = getCustomCategories()[currentType] || [];
            
            if (customs.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-muji-muted text-center py-4">目前沒有任何自訂分類</p>`;
            } else {
                listEl.innerHTML = customs.map(cat => `
                    <div class="flex justify-between items-center bg-muji-bg p-2.5 rounded-xl text-xs text-muji-dark border border-muji-border">
                        <span>${cat}</span>
                        <button type="button" onclick="deleteCustomCategory('${cat}')" class="text-red-500 hover:text-red-700 p-1 cursor-pointer">
                            <i class="fa-solid fa-trash-can pointer-events-none"></i>
                        </button>
                    </div>
                `).join('');
            }

            const modal = document.getElementById('manageCategoryModal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeManageCategoryModal() {
            const modal = document.getElementById('manageCategoryModal');
            if (modal) modal.classList.add('hidden');
        }

        function deleteCustomCategory(catName) {
            if (confirm(`確定要刪除自訂分類「${catName}」嗎？`)) {
                const customs = getCustomCategories();
                customs[currentType] = (customs[currentType] || []).filter(c => c !== catName);
                saveCustomCategories(customs);
                openManageCategoryModal();
                selectedCategory = getActiveCategories(currentType)[0] || '其他';
                renderCategories();
                showToast('已刪除分類');
            }
        }

        // 保存記帳
        function saveRecord(e) {
            if (e) e.preventDefault();
            const dateInput = document.getElementById('inputDate');
            const amountInput = document.getElementById('inputAmount');
            const noteInput = document.getElementById('inputNote');

            const date = dateInput ? dateInput.value : '';
            const amount = amountInput ? parseFloat(amountInput.value) : 0;
            const note = noteInput ? noteInput.value.trim() : '';

            if (!date || isNaN(amount) || amount <= 0) {
                showToast('請輸入正確的日期與金額', 'fa-circle-exclamation');
                return;
            }

            const newRecord = {
                id: Date.now().toString(),
                date,
                type: currentType,
                category: selectedCategory,
                amount,
                note
            };

            const records = getRecords();
            records.unshift(newRecord);
            saveRecordsToStorage(records);

            if (amountInput) amountInput.value = '';
            if (noteInput) noteInput.value = '';
            
            showToast('記帳成功保存！');
            updateAllMonthDropdowns();
            renderList();
            renderSummary();
            switchTab('list');
        }

        // 月份選單更新（保留目前選定值）
        function updateAllMonthDropdowns() {
            const records = getRecords();
            const months = [...new Set(records.map(r => r.date.slice(0, 7)))].sort().reverse();
            const nowYM = new Date().toISOString().slice(0, 7);
            if (!months.includes(nowYM)) {
                months.unshift(nowYM);
            }

            // 1. 明細頁面下拉選單
            const filterSelect = document.getElementById('filterMonth');
            if (filterSelect) {
                const currentFilterVal = filterSelect.value || nowYM;
                filterSelect.innerHTML = months.map(m => `<option value="${m}">${m.replace('-', ' 年 ')} 月</option>`).join('');
                if (months.includes(currentFilterVal)) {
                    filterSelect.value = currentFilterVal;
                }
            }

            // 2. 總結頁面下拉選單
            const summarySelect = document.getElementById('summaryMonthSelect');
            if (summarySelect) {
                summarySelect.innerHTML = months.map(m => `<option value="${m}">${m.replace('-', ' 年 ')} 月</option>`).join('');
                if (months.includes(summaryYearMonth)) {
                    summarySelect.value = summaryYearMonth;
                } else {
                    summarySelect.value = months[0];
                    summaryYearMonth = months[0];
                }
            }

            // 3. 匯出頁面下拉選單
            const exportSelect = document.getElementById('exportMonthSelect');
            if (exportSelect) {
                const currentExportVal = exportSelect.value || 'ALL';
                exportSelect.innerHTML = `<option value="ALL">全部歷史紀錄 (跨月)</option>` + 
                    months.map(m => `<option value="${m}">${m.replace('-', ' 年 ')} 月</option>`).join('');
                exportSelect.value = currentExportVal;
            }
        }

        // 渲染明細列表
        function renderList() {
            const records = getRecords();
            const listContainer = document.getElementById('transactionList');
            const filterMonthSelect = document.getElementById('filterMonth');

            if (!listContainer) return;

            const selectedMonth = (filterMonthSelect && filterMonthSelect.value) ? filterMonthSelect.value : summaryYearMonth;
            const filteredRecords = records.filter(r => r.date.startsWith(selectedMonth));

            const listCountEl = document.getElementById('listCount');
            if (listCountEl) listCountEl.innerText = `共 ${filteredRecords.length} 筆`;

            if (filteredRecords.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-muji-card p-8 rounded-3xl border border-muji-border text-center space-y-2">
                        <i class="fa-solid fa-receipt text-3xl text-muji-muted/40"></i>
                        <p class="text-xs text-muji-muted">這個月還沒有任何記帳紀錄喔</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = filteredRecords.map(r => {
                let badgeStyle = "bg-muji-expenseBg text-muji-expense";
                let amountPrefix = "-";
                if (r.type === 'income') {
                    badgeStyle = "bg-muji-incomeBg text-muji-income";
                    amountPrefix = "+";
                }

                const icon = categoryIcons[r.category] || 'fa-tag';

                return `
                    <div class="bg-muji-card p-4 rounded-2xl border border-muji-border shadow-sm flex items-center justify-between hover:border-muji-accent/50 transition">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl ${badgeStyle} flex items-center justify-center">
                                <i class="fa-solid ${icon} text-sm"></i>
                            </div>
                            <div>
                                <div class="flex items-center space-x-1.5">
                                    <span class="text-sm font-bold text-muji-dark">${r.category}</span>
                                    <span class="text-[10px] text-muji-muted">${r.date}</span>
                                </div>
                                <p class="text-xs text-muji-muted truncate max-w-[140px]">${r.note || '無備註'}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-base font-bold ${r.type === 'income' ? 'text-muji-income' : 'text-muji-expense'}">
                                ${amountPrefix}$${r.amount.toLocaleString()}
                            </span>
                            <button type="button" onclick="deleteRecord('${r.id}')" class="text-muji-border hover:text-red-400 transition p-1 cursor-pointer">
                                <i class="fa-solid fa-trash-can text-xs pointer-events-none"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 刪除紀錄
        function deleteRecord(id) {
            if (confirm('確定要刪除這筆記帳紀錄嗎？')) {
                let records = getRecords();
                records = records.filter(r => r.id !== id);
                saveRecordsToStorage(records);
                showToast('已刪除紀錄');
                updateAllMonthDropdowns();
                renderList();
                renderSummary();
            }
        }

        // 渲染月度總結
        function renderSummary() {
            const records = getRecords();
            const monthRecords = records.filter(r => r.date.startsWith(summaryYearMonth));

            const summarySelect = document.getElementById('summaryMonthSelect');
            if (summarySelect) summarySelect.value = summaryYearMonth;

            let totalIncome = 0;
            let totalExpense = 0;
            const categorySums = {};

            monthRecords.forEach(r => {
                if (r.type === 'income') {
                    totalIncome += r.amount;
                } else if (r.type === 'expense') {
                    totalExpense += r.amount;
                    categorySums[r.category] = (categorySums[r.category] || 0) + r.amount;
                }
            });

            const netBalance = totalIncome - totalExpense;

            const sumIncomeEl = document.getElementById('sumIncome');
            const sumExpenseEl = document.getElementById('sumExpense');
            if (sumIncomeEl) sumIncomeEl.innerText = `NT$ ${totalIncome.toLocaleString()}`;
            if (sumExpenseEl) sumExpenseEl.innerText = `NT$ ${totalExpense.toLocaleString()}`;
            
            const netElem = document.getElementById('sumNetBalance');
            if (netElem) {
                netElem.innerText = `NT$ ${netBalance.toLocaleString()}`;
                netElem.className = `text-3xl font-extrabold ${netBalance >= 0 ? 'text-muji-dark' : 'text-muji-expense'}`;
            }

            const statusEl = document.getElementById('balanceStatusText');
            if (statusEl) {
                statusEl.innerText = netBalance >= 0 ? '財務狀況健康，繼續保持！' : '本月支出已超出收入，請注意開支。';
            }

            const breakdownContainer = document.getElementById('categoryBreakdown');
            if (!breakdownContainer) return;

            const sortedCategories = Object.entries(categorySums).sort((a, b) => b - a);

            if (sortedCategories.length === 0) {
                breakdownContainer.innerHTML = `<p class="text-xs text-muji-muted text-center py-2">本月尚無支出分類數據</p>`;
                return;
            }

            breakdownContainer.innerHTML = sortedCategories.map(([cat, sum]) => {
                const percent = totalExpense > 0 ? ((sum / totalExpense) * 100).toFixed(1) : 0;
                return `
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs text-muji-dark">
                            <span class="font-medium">${cat}</span>
                            <span class="text-muji-muted">$${sum.toLocaleString()} (${percent}%)</span>
                        </div>
                        <div class="w-full h-2 bg-muji-bg rounded-full overflow-hidden border border-muji-border/50">
                            <div class="h-full bg-muji-expense/80 rounded-full" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function onSummaryMonthSelectChange() {
            const select = document.getElementById('summaryMonthSelect');
            if (select) {
                summaryYearMonth = select.value;
                renderSummary();
            }
        }

        function changeSummaryMonth(offset) {
            const [y, m] = summaryYearMonth.split('-').map(Number);
            let targetM = m + offset;
            let targetY = y;
            if (targetM > 12) {
                targetM = 1;
                targetY += 1;
            } else if (targetM < 1) {
                targetM = 12;
                targetY -= 1;
            }
            summaryYearMonth = `${targetY}-${String(targetM).padStart(2, '0')}`;
            renderSummary();
        }

        // Excel 匯出
        function exportToExcel() {
            if (typeof XLSX === 'undefined') {
                showToast('Excel 套件載入失敗，請檢查網路連線', 'fa-circle-exclamation');
                return;
            }

            const records = getRecords();
            if (records.length === 0) {
                showToast('目前沒有可供匯出的資料', 'fa-circle-exclamation');
                return;
            }

            const exportSelect = document.getElementById('exportMonthSelect');
            const selectedMonth = exportSelect ? exportSelect.value : 'ALL';
            let targetRecords = records;
            let periodTitle = "全部月份";

            if (selectedMonth !== 'ALL') {
                targetRecords = records.filter(r => r.date.startsWith(selectedMonth));
                periodTitle = selectedMonth.replace('-', '年') + '月';
            }

            if (targetRecords.length === 0) {
                showToast('選取的月份目前沒有記帳紀錄', 'fa-circle-exclamation');
                return;
            }

            let totalIncome = 0;
            let totalExpense = 0;

            const exportData = targetRecords.map((r, index) => {
                if (r.type === 'income') totalIncome += r.amount;
                if (r.type === 'expense') totalExpense += r.amount;

                return {
                    '序號': index + 1,
                    '日期': r.date,
                    '類型': r.type === 'income' ? '收入' : '支出',
                    '分類': r.category,
                    '金額 (NT$)': r.amount,
                    '備註/細項': r.note || ''
                };
            });

            const netBalance = totalIncome - totalExpense;

            exportData.push({});
            exportData.push({
                '序號': `【${periodTitle} 統計總結】`,
                '日期': '',
                '類型': '',
                '分類': '當期總收入',
                '金額 (NT$)': totalIncome,
                '備註/細項': ''
            });
            exportData.push({
                '序號': '',
                '日期': '',
                '類型': '',
                '分類': '當期總支出',
                '金額 (NT$)': totalExpense,
                '備註/細項': ''
            });
            exportData.push({
                '序號': '',
                '日期': '',
                '類型': '',
                '分類': '結餘 (收入 - 支出)',
                '金額 (NT$)': netBalance,
                '備註/細項': netBalance >= 0 ? '財務狀況健康' : '支出超出收入'
            });

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, `${periodTitle}結餘報表`);

            worksheet['!cols'] = [{ wch: 20 }, { wch: 12 }, { wch: 8 }, { wch: 18 }, { wch: 14 }, { wch: 24 }];

            const fileName = `極簡記帳_${periodTitle}_明細與結餘總表_${new Date().toISOString().slice(0, 10)}.xlsx`;
            XLSX.writeFile(workbook, fileName);
            showToast(`已成功匯出 ${periodTitle} Excel 報表！`);
        }

        // JSON 備份功能 (iPhone Safari 支援)
        async function backupJSON() {
            const records = getRecords();
            const customs = getCustomCategories();
            const dataToExport = {
                version: "1.0",
                exportDate: new Date().toISOString(),
                records: records,
                customCategories: customs
            };

            const jsonStr = JSON.stringify(dataToExport, null, 2);
            const fileName = `無印極簡記帳_JSON備份檔_${new Date().toISOString().slice(0, 10)}.json`;

            try {
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const file = new File([blob], fileName, { type: 'application/json' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: '無印極簡記帳備份檔',
                        text: '備份檔已生成，請選擇儲存至「檔案」'
                    });
                    showToast('已開啟選單匯出備份');
                    return;
                }
            } catch (err) {
                console.log("Native share failed, fallback to download link", err);
            }

            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('已下載 JSON 備份檔！');
        }

        // JSON 還原功能
        function restoreJSON(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const importedData = JSON.parse(evt.target.result);
                    if (importedData && Array.isArray(importedData.records)) {
                        saveRecordsToStorage(importedData.records);
                        if (importedData.customCategories) {
                            saveCustomCategories(importedData.customCategories);
                        }
                        showToast('已成功還原備份資料！');
                        updateAllMonthDropdowns();
                        renderCategories();
                        renderList();
                        renderSummary();
                        switchTab('list');
                    } else {
                        showToast('備份檔格式不符', 'fa-circle-exclamation');
                    }
                } catch (err) {
                    showToast('讀取備份檔失敗', 'fa-circle-exclamation');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function clearAllData() {
            if (confirm('確定要清除所有本機記帳紀錄與自訂分類嗎？此動作無法復原！')) {
                localStorage.removeItem('muji_accounting_records');
                localStorage.removeItem('muji_custom_categories');
                showToast('資料已全數清空');
                updateAllMonthDropdowns();
                renderCategories();
                renderList();
                renderSummary();
            }
        }

        // 切換分頁 (Tabs)
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById(`tab-${tabId}`);
            if (target) {
                target.classList.remove('hidden');
            }

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = "nav-btn flex flex-col items-center space-y-1 text-muji-muted hover:text-muji-dark cursor-pointer";
            });
            const activeNav = document.getElementById(`nav-${tabId}`);
            if (activeNav) {
                activeNav.className = "nav-btn flex flex-col items-center space-y-1 text-muji-dark font-bold cursor-pointer";
            }

            if (tabId === 'settings') {
                updateAllMonthDropdowns();
            } else if (tabId === 'list') {
                renderList();
            } else if (tabId === 'summary') {
                renderSummary();
            }
        }

        function updateHeaderMonth() {
            const now = new Date();
            const headerEl = document.getElementById('headerMonth');
            if (headerEl) {
                headerEl.innerText = `${now.getFullYear()} 年 ${now.getMonth() + 1} 月`;
            }
        }

        function showToast(msg, icon = 'fa-circle-check') {
            const toast = document.getElementById('toast');
            if (!toast) return;
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            if (toastMsg) toastMsg.innerText = msg;
            if (toastIcon) toastIcon.className = `fa-solid ${icon} text-emerald-400`;
            
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }
    </script>
</body>
