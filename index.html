<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>極簡記帳</title>

    <!-- iOS Web App & Home Screen Icon Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="記帳本">
    <link rel="apple-touch-icon" id="appleTouchIcon" href="">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS CDN (Excel 匯出套件) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts: Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        muji: {
                            bg: '#FAF7F2',        // 奶油暖白底色
                            card: '#FFFFFF',      // 純白卡片
                            border: '#EFECE6',    // 柔和質感邊框
                            dark: '#3B3632',      // 暖炭灰文字
                            muted: '#8C827A',     // 莫蘭迪次要文字
                            accent: '#D4C3AC',    // 燕麥奶大地色
                            income: '#4E7A62',    // 鼠尾草綠 (收入)
                            incomeBg: '#EAF2ED',
                            expense: '#C05A46',   // 陶土紅 (支出)
                            expenseBg: '#FDF0EE'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAF7F2;
            color: #3B3632;
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .pb-safe {
            padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
        }
    </style>
</head>
<body class="min-h-screen max-w-md mx-auto relative shadow-md bg-muji-bg flex flex-col justify-between pb-28 border-x border-muji-border/60">

    <!-- 頂部標題列 -->
    <header class="bg-muji-card/80 backdrop-blur-md sticky top-0 z-30 px-6 py-4 border-b border-muji-border flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-muji-accent/30 flex items-center justify-center text-muji-dark">
                <i class="fa-solid font-bold fa-book-open text-xs"></i>
            </div>
            <h1 class="text-lg font-bold tracking-wide text-muji-dark">極簡記帳</h1>
        </div>
        <span id="headerMonth" class="text-xs font-medium text-muji-muted bg-muji-bg px-3 py-1 rounded-full border border-muji-border">
            -- 年 -- 月
        </span>
    </header>

    <!-- 主體內容分頁 container -->
    <main class="flex-1 p-5 space-y-5">

        <!-- ===== 分頁 1: 記帳輸入 ===== -->
        <section id="tab-record" class="tab-content space-y-5">
            <!-- 類型切換頁籤 (支出 / 收入) -->
            <div class="bg-muji-card p-1.5 rounded-2xl border border-muji-border flex justify-between space-x-1.5 shadow-sm">
                <button type="button" onclick="setType('expense')" id="btn-type-expense"
                    class="flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 bg-muji-expenseBg text-muji-expense shadow-sm font-semibold">
                    <i class="fa-solid fa-minus text-xs pointer-events-none"></i>
                    <span class="pointer-events-none">支出</span>
                </button>
                <button type="button" onclick="setType('income')" id="btn-type-income"
                    class="flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 text-muji-muted hover:text-muji-dark">
                    <i class="fa-solid fa-plus text-xs pointer-events-none"></i>
                    <span class="pointer-events-none">收入</span>
                </button>
            </div>

            <!-- 輸入表單卡片 -->
            <form id="recordForm" onsubmit="saveRecord(event)" class="bg-muji-card p-6 rounded-3xl border border-muji-border shadow-sm space-y-5">
                
                <!-- 日期選擇 -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-muji-muted block">記帳日期</label>
                    <div class="relative">
                        <input type="date" id="inputDate" required
                            class="w-full bg-muji-bg border border-muji-border rounded-xl px-4 py-3 text-sm text-muji-dark focus:outline-none focus:ring-2 focus:ring-muji-accent/50 transition">
                    </div>
                </div>

                <!-- 金額輸入 -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-muji-muted block">交易金額 (NT$)</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-lg font-semibold text-muji-muted">$</span>
                        <input type="number" id="inputAmount" min="1" step="any" placeholder="0" required
                            class="w-full bg-muji-bg border border-muji-border rounded-xl pl-9 pr-4 py-3 text-xl font-semibold text-muji-dark focus:outline-none focus:ring-2 focus:ring-muji-accent/50 transition">
                    </div>
                </div>

                <!-- 分類選擇 -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-medium text-muji-muted block">選擇分類</label>
                        <button type="button" onclick="openManageCategoriesModal()" class="text-[11px] text-muji-muted hover:text-muji-dark font-medium underline">
                            管理分類
                        </button>
                    </div>
                    <div id="categoryContainer" class="grid grid-cols-4 gap-2"></div>
                </div>

                <!-- 支出細項 / 備註 -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-muji-muted block">備註細項</label>
                    <input type="text" id="inputNote" placeholder="例如：早餐便當、水電費單..."
                        class="w-full bg-muji-bg border border-muji-border rounded-xl px-4 py-3 text-sm text-muji-dark focus:outline-none focus:ring-2 focus:ring-muji-accent/50 transition">
                </div>

                <!-- 儲存按鈕 -->
                <button type="submit"
                    class="w-full bg-muji-dark hover:bg-black text-white font-medium py-3.5 rounded-2xl shadow-sm transition active:scale-[0.99] flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-check text-xs"></i>
                    <span>儲存這筆記帳</span>
                </button>
            </form>
        </section>

        <!-- ===== 分頁 2: 明細列表 ===== -->
        <section id="tab-list" class="tab-content hidden space-y-4">
            <div class="flex items-center justify-between space-x-2 bg-muji-card p-3 rounded-2xl border border-muji-border shadow-sm">
                <div class="flex items-center space-x-2 flex-1">
                    <i class="fa-solid fa-filter text-muji-muted text-xs pl-2"></i>
                    <select id="filterMonth" onchange="renderList()"
                        class="bg-transparent text-sm font-medium text-muji-dark focus:outline-none w-full cursor-pointer">
                    </select>
                </div>
                <div class="text-xs text-muji-muted font-medium pr-2" id="listCount">
                    共 0 筆
                </div>
            </div>

            <div id="transactionList" class="space-y-3"></div>
        </section>

        <!-- ===== 分頁 3: 每月總結 ===== -->
        <section id="tab-summary" class="tab-content hidden space-y-5">
            <div class="flex justify-between items-center bg-muji-card p-4 rounded-2xl border border-muji-border shadow-sm">
                <button type="button" onclick="changeSummaryMonth(-1)" class="w-8 h-8 rounded-full bg-muji-bg border border-muji-border text-muji-dark flex items-center justify-center hover:bg-muji-border/40 active:scale-95 transition">
                    <i class="fa-solid fa-chevron-left text-xs pointer-events-none"></i>
                </button>
                <div id="summaryMonthTitle" class="text-base font-bold text-muji-dark">
                    ---- 年 -- 月
                </div>
                <button type="button" onclick="changeSummaryMonth(1)" class="w-8 h-8 rounded-full bg-muji-bg border border-muji-border text-muji-dark flex items-center justify-center hover:bg-muji-border/40 active:scale-95 transition">
                    <i class="fa-solid fa-chevron-right text-xs pointer-events-none"></i>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-muji-incomeBg/60 p-4 rounded-2xl border border-muji-income/20 space-y-1">
                    <span class="text-xs font-medium text-muji-income flex items-center gap-1">
                        <i class="fa-solid fa-circle-arrow-down text-[10px]"></i> 當月總收入
                    </span>
                    <div id="sumIncome" class="text-lg font-bold text-muji-income">NT$ 0</div>
                </div>
                <div class="bg-muji-expenseBg/60 p-4 rounded-2xl border border-muji-expense/20 space-y-1">
                    <span class="text-xs font-medium text-muji-expense flex items-center gap-1">
                        <i class="fa-solid fa-circle-arrow-up text-[10px]"></i> 當月總支出
                    </span>
                    <div id="sumExpense" class="text-lg font-bold text-muji-expense">NT$ 0</div>
                </div>
            </div>

            <div class="bg-muji-card p-5 rounded-3xl border border-muji-border shadow-sm space-y-2 text-center">
                <span class="text-xs font-medium text-muji-muted">當月剩餘 / 結餘 (收入 - 支出)</span>
                <div id="sumNetBalance" class="text-3xl font-extrabold text-muji-dark">
                    NT$ 0
                </div>
                <div id="balanceStatusText" class="text-xs text-muji-muted pt-1">
                    財務狀況良好
                </div>
            </div>

            <div class="bg-muji-card p-5 rounded-3xl border border-muji-border shadow-sm space-y-4">
                <h3 class="text-xs font-bold text-muji-dark tracking-wide uppercase flex items-center justify-between">
                    <span>支出分類排行榜</span>
                    <i class="fa-solid fa-chart-pie text-muji-muted"></i>
                </h3>
                <div id="categoryBreakdown" class="space-y-3"></div>
            </div>
        </section>

        <!-- ===== 分頁 4: 匯出與設定 ===== -->
        <section id="tab-settings" class="tab-content hidden space-y-4">
            
            <!-- Excel 匯出卡片 -->
            <div class="bg-muji-card p-5 rounded-3xl border border-muji-border shadow-sm space-y-4">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center border border-emerald-100">
                        <i class="fa-solid fa-file-excel text-lg"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-muji-dark">匯出 Excel 報表</h3>
                        <p class="text-xs text-muji-muted">自由選擇指定月份或全部紀錄匯出</p>
                    </div>
                </div>

                <div class="space-y-1.5 pt-1">
                    <label class="text-xs font-medium text-muji-muted block">選擇匯出範圍 / 月份</label>
                    <select id="exportMonthSelect" class="w-full bg-muji-bg border border-muji-border rounded-xl px-4 py-3 text-sm font-medium text-muji-dark focus:outline-none focus:ring-2 focus:ring-muji-accent/50 transition">
                    </select>
                </div>

                <button type="button" onclick="exportToExcel()"
                    class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-3 rounded-xl shadow-sm transition active:scale-[0.99] flex items-center justify-center space-x-2 text-sm">
                    <i class="fa-solid fa-download text-xs pointer-events-none"></i>
                    <span class="pointer-events-none">匯出指定月份報表 (.xlsx)</span>
                </button>
            </div>

            <!-- JSON 備份與還原卡片 -->
            <div class="bg-muji-card p-5 rounded-3xl border border-muji-border shadow-sm space-y-4">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-2xl bg-amber-50 text-amber-700 flex items-center justify-center border border-amber-100">
                        <i class="fa-solid fa-database text-lg"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-muji-dark">JSON 備份與還原</h3>
                        <p class="text-xs text-muji-muted">備份及跨裝置同步您的全套記帳資料</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-2.5 pt-1">
                    <!-- 1. 下載 JSON 檔案 -->
                    <button type="button" onclick="exportJsonFile()"
                        class="w-full bg-muji-bg hover:bg-muji-border/50 text-muji-dark font-medium py-3 px-4 rounded-xl border border-muji-border text-xs transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-file-arrow-down text-muji-accent"></i>
                        <span>備份 / 下載 JSON 檔案 (.json)</span>
                    </button>

                    <!-- 2. 複製 JSON 文字至剪貼簿 -->
                    <button type="button" onclick="copyJsonText()"
                        class="w-full bg-muji-bg hover:bg-muji-border/50 text-muji-dark font-medium py-3 px-4 rounded-xl border border-muji-border text-xs transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-copy text-muji-accent"></i>
                        <span>複製 JSON 備份文字 (至剪貼簿)</span>
                    </button>

                    <!-- 3. 上傳 JSON 檔案還原 -->
                    <button type="button" onclick="document.getElementById('jsonFileInput').click()"
                        class="w-full bg-amber-600/10 hover:bg-amber-600/20 text-amber-800 font-medium py-3 px-4 rounded-xl border border-amber-200 text-xs transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-file-arrow-up text-amber-700"></i>
                        <span>上傳 JSON 檔案還原 (.json)</span>
                    </button>
                    <input type="file" id="jsonFileInput" accept=".json,application/json" class="hidden" onchange="importJsonFile(event)">

                    <!-- 4. 貼上 JSON 文字還原 (新增) -->
                    <button type="button" onclick="openTextRestoreModal()"
                        class="w-full bg-amber-700 text-white font-medium py-3 px-4 rounded-xl shadow-sm transition active:scale-[0.99] text-xs flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-paste text-xs"></i>
                        <span>貼上 JSON 文字進行還原</span>
                    </button>
                </div>
            </div>

            <!-- 本機記憶體管理卡片 -->
            <div class="bg-muji-card p-5 rounded-3xl border border-muji-border shadow-sm space-y-3">
                <h3 class="text-xs font-bold text-muji-dark tracking-wide">資料庫管理 (LocalStorage)</h3>
                <p class="text-xs text-muji-muted leading-relaxed">
                    所有記帳資料均妥善儲存於手機區域記憶體中。清除後將無法復原。
                </p>
                <div class="pt-1">
                    <button type="button" onclick="clearAllData()"
                        class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-medium py-2.5 rounded-xl border border-red-100 text-xs transition">
                        清除所有本機資料
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- ===== 彈出 Modal 1: 貼上 JSON 文字還原窗口 ===== -->
    <div id="textRestoreModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-muji-card w-full max-w-sm rounded-3xl p-6 shadow-xl space-y-4 border border-muji-border">
            <div class="flex justify-between items-center border-b border-muji-border pb-3">
                <h3 class="text-sm font-bold text-muji-dark flex items-center space-x-2">
                    <i class="fa-solid fa-paste text-amber-600"></i>
                    <span>貼上 JSON 備份文字還原</span>
                </h3>
                <button type="button" onclick="closeTextRestoreModal()" class="text-muji-muted hover:text-muji-dark p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            
            <div class="space-y-2">
                <label class="text-xs text-muji-muted block">請在下方文字框貼上您的 JSON 備份內容：</label>
                <textarea id="jsonPasteArea" rows="6" placeholder='{"records":[...],"customCategories":{...}}'
                    class="w-full bg-muji-bg border border-muji-border rounded-xl p-3 text-xs text-muji-dark font-mono focus:outline-none focus:ring-2 focus:ring-muji-accent/50 transition"></textarea>
            </div>

            <div class="flex space-x-2 pt-2">
                <button type="button" onclick="closeTextRestoreModal()" class="flex-1 py-2.5 rounded-xl bg-muji-bg border border-muji-border text-muji-dark text-xs font-medium">
                    取消
                </button>
                <button type="button" onclick="processTextRestore()" class="flex-1 py-2.5 rounded-xl bg-amber-700 text-white text-xs font-medium shadow-sm active:scale-95 transition">
                    確認還原
                </button>
            </div>
        </div>
    </div>

    <!-- ===== 彈出 Modal 2: 管理自訂分類窗口 ===== -->
    <div id="manageCategoriesModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-muji-card w-full max-w-sm rounded-3xl p-6 shadow-xl space-y-4 border border-muji-border">
            <div class="flex justify-between items-center border-b border-muji-border pb-3">
                <h3 class="text-sm font-bold text-muji-dark flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-muji-accent"></i>
                    <span>管理自訂分類</span>
                </h3>
                <button type="button" onclick="closeManageCategoriesModal()" class="text-muji-muted hover:text-muji-dark p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <div id="customCategoriesList" class="max-h-60 overflow-y-auto space-y-2 pr-1 no-scrollbar">
                <!-- 動態注入自訂分類項目 -->
            </div>

            <div class="pt-2">
                <button type="button" onclick="closeManageCategoriesModal()" class="w-full py-2.5 rounded-xl bg-muji-dark text-white text-xs font-medium shadow-sm">
                    完成
                </button>
            </div>
        </div>
    </div>

    <!-- 底部導航列 -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-muji-card/90 backdrop-blur-md border-t border-muji-border px-6 py-2.5 pb-safe z-40 flex justify-between items-center">
        <button type="button" onclick="switchTab('record')" id="nav-record" class="nav-btn flex-1 flex flex-col items-center space-y-1 text-muji-dark font-bold">
            <i class="fa-solid fa-pen-to-square text-lg pointer-events-none"></i>
            <span class="text-[10px] font-medium pointer-events-none">記帳</span>
        </button>
        <button type="button" onclick="switchTab('list')" id="nav-list" class="nav-btn flex-1 flex flex-col items-center space-y-1 text-muji-muted hover:text-muji-dark">
            <i class="fa-solid fa-list-ul text-lg pointer-events-none"></i>
            <span class="text-[10px] font-medium pointer-events-none">明細</span>
        </button>
        <button type="button" onclick="switchTab('summary')" id="nav-summary" class="nav-btn flex-1 flex flex-col items-center space-y-1 text-muji-muted hover:text-muji-dark">
            <i class="fa-solid fa-chart-simple text-lg pointer-events-none"></i>
            <span class="text-[10px] font-medium pointer-events-none">總結</span>
        </button>
        <button type="button" onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex-1 flex flex-col items-center space-y-1 text-muji-muted hover:text-muji-dark">
            <i class="fa-solid fa-gear text-lg pointer-events-none"></i>
            <span class="text-[10px] font-medium pointer-events-none">設定</span>
        </button>
    </nav>

    <!-- 吐司通知提示 (Toast) -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-muji-dark text-white text-xs py-2.5 px-5 rounded-full shadow-lg transition-all opacity-0 pointer-events-none duration-300 z-50 flex items-center space-x-2">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">操作成功</span>
    </div>

    <!-- JavaScript 邏輯引擎 -->
    <script>
        // 預設分類設定
        const defaultCategories = {
            expense: ['零用金', '薪資支出', '雜項', '稅金', '水電費', '勞健保', '電話費', '其他'],
            income: ['薪資收入', '兼職所得', '投資理財', '零用金/紅包', '其他']
        };

        const categoryIcons = {
            '零用金': 'fa-wallet',
            '薪資支出': 'fa-money-check-dollar',
            '雜項': 'fa-box-archive',
            '稅金': 'fa-file-invoice-dollar',
            '水電費': 'fa-bolt',
            '勞健保': 'fa-notes-medical',
            '電話費': 'fa-mobile-screen-button',
            '其他': 'fa-ellipsis',
            '薪資收入': 'fa-sack-dollar',
            '兼職所得': 'fa-briefcase',
            '投資理財': 'fa-chart-line',
            '零用金/紅包': 'fa-gift'
        };

        let currentType = 'expense';
        let selectedCategory = '零用金';
        let summaryYearMonth = new Date().toISOString().slice(0, 7);

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('inputDate').valueAsDate = new Date();
            generateHighResAppleTouchIcon();
            updateHeaderMonth();
            renderCategories();
            renderList();
            renderSummary();
            updateExportMonthOptions();
        });

        // 讀取/儲存 LocalStorage 記帳紀錄
        function getRecords() {
            const data = localStorage.getItem('muji_accounting_records');
            return data ? JSON.parse(data) : [];
        }

        function saveRecordsToStorage(records) {
            localStorage.setItem('muji_accounting_records', JSON.stringify(records));
        }

        // 讀取/儲存 LocalStorage 自訂分類
        function getCustomCategories() {
            const data = localStorage.getItem('muji_custom_categories');
            return data ? JSON.parse(data) : { expense: [], income: [] };
        }

        function saveCustomCategories(custom) {
            localStorage.setItem('muji_custom_categories', JSON.stringify(custom));
        }

        // 取得整合後的全部分類 (預設 + 自訂)
        function getAllCategories(type) {
            const custom = getCustomCategories();
            const list = [...defaultCategories[type], ...(custom[type] || [])];
            return [...new Set(list)];
        }

        // 切換支出 / 收入 類型
        function setType(type) {
            currentType = type;
            const btnExpense = document.getElementById('btn-type-expense');
            const btnIncome = document.getElementById('btn-type-income');

            if (type === 'expense') {
                btnExpense.className = "flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 bg-muji-expenseBg text-muji-expense shadow-sm font-semibold";
                btnIncome.className = "flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 text-muji-muted hover:text-muji-dark";
            } else {
                btnIncome.className = "flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 bg-muji-incomeBg text-muji-income shadow-sm font-semibold";
                btnExpense.className = "flex-1 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center justify-center space-x-1.5 text-muji-muted hover:text-muji-dark";
            }

            const allCats = getAllCategories(type);
            selectedCategory = allCats[0] || '其他';
            renderCategories();
        }

        // 渲染分類按鈕
        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            if (!container) return;
            container.innerHTML = '';
            
            const allCats = getAllCategories(currentType);

            allCats.forEach(cat => {
                const isSelected = cat === selectedCategory;
                const icon = categoryIcons[cat] || 'fa-tag';
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => {
                    selectedCategory = cat;
                    renderCategories();
                };
                
                btn.className = `p-2.5 rounded-xl text-xs flex flex-col items-center justify-center space-y-1 transition border ${
                    isSelected 
                        ? 'bg-muji-dark text-white border-muji-dark shadow-sm font-medium' 
                        : 'bg-muji-bg text-muji-dark border-muji-border hover:bg-muji-border/30'
                }`;

                btn.innerHTML = `
                    <i class="fa-solid ${icon} text-sm pointer-events-none"></i>
                    <span class="truncate w-full text-center pointer-events-none">${cat}</span>
                `;
                container.appendChild(btn);
            });

            // 新增自訂分類按鈕
            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.onclick = promptAddCustomCategory;
            addBtn.className = "p-2.5 rounded-xl text-xs flex flex-col items-center justify-center space-y-1 transition border border-dashed border-muji-muted/50 text-muji-muted hover:text-muji-dark hover:border-muji-dark";
            addBtn.innerHTML = `
                <i class="fa-solid fa-plus text-sm pointer-events-none"></i>
                <span class="truncate w-full text-center pointer-events-none">新增</span>
            `;
            container.appendChild(addBtn);
        }

        // 彈出新增自訂分類 Prompt
        function promptAddCustomCategory() {
            const name = prompt(`新增「${currentType === 'expense' ? '支出' : '收入'}」自訂分類名稱：`);
            if (!name) return;
            const trimmed = name.trim();
            if (!trimmed) return;

            const custom = getCustomCategories();
            if (!custom[currentType]) custom[currentType] = [];

            const allCats = getAllCategories(currentType);
            if (allCats.includes(trimmed)) {
                showToast('該分類名稱已存在！', 'fa-circle-exclamation');
                return;
            }

            custom[currentType].push(trimmed);
            saveCustomCategories(custom);
            selectedCategory = trimmed;
            showToast(`已新增分類：${trimmed}`);
            renderCategories();
        }

        // 管理自訂分類 Modal
        function openManageCategoriesModal() {
            const modal = document.getElementById('manageCategoriesModal');
            const listContainer = document.getElementById('customCategoriesList');
            const custom = getCustomCategories();
            
            const expenseCustom = custom.expense || [];
            const incomeCustom = custom.income || [];

            if (expenseCustom.length === 0 && incomeCustom.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-muji-muted text-center py-4">目前尚無任何自訂分類。</p>`;
            } else {
                let html = '';
                if (expenseCustom.length > 0) {
                    html += `<div class="text-[11px] font-bold text-muji-expense pt-1">支出自訂分類</div>`;
                    expenseCustom.forEach(c => {
                        html += `
                            <div class="flex justify-between items-center bg-muji-bg p-2.5 rounded-xl border border-muji-border text-xs">
                                <span>${c}</span>
                                <button type="button" onclick="deleteCustomCategory('expense', '${c}')" class="text-muji-muted hover:text-red-500 text-xs">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        `;
                    });
                }
                if (incomeCustom.length > 0) {
                    html += `<div class="text-[11px] font-bold text-muji-income pt-2">收入自訂分類</div>`;
                    incomeCustom.forEach(c => {
                        html += `
                            <div class="flex justify-between items-center bg-muji-bg p-2.5 rounded-xl border border-muji-border text-xs">
                                <span>${c}</span>
                                <button type="button" onclick="deleteCustomCategory('income', '${c}')" class="text-muji-muted hover:text-red-500 text-xs">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        `;
                    });
                }
                listContainer.innerHTML = html;
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeManageCategoriesModal() {
            document.getElementById('manageCategoriesModal').classList.add('opacity-0', 'pointer-events-none');
        }

        function deleteCustomCategory(type, name) {
            if (confirm(`確定要刪除「${name}」自訂分類嗎？`)) {
                const custom = getCustomCategories();
                if (custom[type]) {
                    custom[type] = custom[type].filter(item => item !== name);
                    saveCustomCategories(custom);
                    showToast(`已刪除分類：${name}`);
                    renderCategories();
                    openManageCategoriesModal();
                }
            }
        }

        // 新增單筆記帳紀錄
        function saveRecord(e) {
            e.preventDefault();
            const date = document.getElementById('inputDate').value;
            const amount = parseFloat(document.getElementById('inputAmount').value);
            const note = document.getElementById('inputNote').value.trim();

            if (!date || isNaN(amount) || amount <= 0) {
                showToast('請輸入正確的日期與金額', 'fa-circle-exclamation');
                return;
            }

            const newRecord = {
                id: Date.now().toString(),
                date,
                type: currentType,
                category: selectedCategory,
                amount,
                note
            };

            const records = getRecords();
            records.unshift(newRecord);
            saveRecordsToStorage(records);

            document.getElementById('inputAmount').value = '';
            document.getElementById('inputNote').value = '';
            
            showToast('記帳成功保存！');
            renderList();
            renderSummary();
            updateExportMonthOptions();
            switchTab('list');
        }

        // 渲染明細列表
        function renderList() {
            const records = getRecords();
            const listContainer = document.getElementById('transactionList');
            const filterMonthSelect = document.getElementById('filterMonth');
            if (!listContainer || !filterMonthSelect) return;

            const months = [...new Set(records.map(r => r.date.slice(0, 7)))].sort().reverse();
            if (months.length === 0) {
                months.push(new Date().toISOString().slice(0, 7));
            }

            const savedSelectedMonth = filterMonthSelect.value;
            filterMonthSelect.innerHTML = months.map(m => 
                `<option value="${m}">${m.replace('-', ' 年 ')} 月</option>`
            ).join('');

            if (savedSelectedMonth && months.includes(savedSelectedMonth)) {
                filterMonthSelect.value = savedSelectedMonth;
            }

            const selectedMonth = filterMonthSelect.value || months[0];
            const filteredRecords = records.filter(r => r.date.startsWith(selectedMonth));

            document.getElementById('listCount').innerText = `共 ${filteredRecords.length} 筆`;

            if (filteredRecords.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-muji-card p-8 rounded-3xl border border-muji-border text-center space-y-2">
                        <i class="fa-solid fa-receipt text-3xl text-muji-muted/40"></i>
                        <p class="text-xs text-muji-muted">這個月還沒有任何記帳紀錄喔</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = filteredRecords.map(r => {
                const badgeStyle = r.type === 'income' ? "bg-muji-incomeBg text-muji-income" : "bg-muji-expenseBg text-muji-expense";
                const amountPrefix = r.type === 'income' ? "+" : "-";
                const icon = categoryIcons[r.category] || 'fa-tag';

                return `
                    <div class="bg-muji-card p-4 rounded-2xl border border-muji-border shadow-sm flex items-center justify-between hover:border-muji-accent/50 transition">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl ${badgeStyle} flex items-center justify-center">
                                <i class="fa-solid ${icon} text-sm"></i>
                            </div>
                            <div>
                                <div class="flex items-center space-x-1.5">
                                    <span class="text-sm font-bold text-muji-dark">${r.category}</span>
                                    <span class="text-[10px] text-muji-muted">${r.date}</span>
                                </div>
                                <p class="text-xs text-muji-muted truncate max-w-[140px]">${r.note || '無備註'}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-base font-bold ${r.type === 'income' ? 'text-muji-income' : 'text-muji-expense'}">
                                ${amountPrefix}$${r.amount.toLocaleString()}
                            </span>
                            <button type="button" onclick="deleteRecord('${r.id}')" class="text-muji-border hover:text-red-400 transition p-1">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

        // 刪除紀錄
        function deleteRecord(id) {
            if (confirm('確定要刪除這筆記帳紀錄嗎？')) {
                let records = getRecords();
                records = records.filter(r => r.id !== id);
                saveRecordsToStorage(records);
                showToast('已刪除紀錄');
                renderList();
                renderSummary();
                updateExportMonthOptions();
            }
        }

        // 渲染每月總結
        function renderSummary() {
            const records = getRecords();
            const monthRecords = records.filter(r => r.date.startsWith(summaryYearMonth));

            const summaryMonthTitle = document.getElementById('summaryMonthTitle');
            if (summaryMonthTitle) {
                summaryMonthTitle.innerText = summaryYearMonth.replace('-', ' 年 ') + ' 月';
            }

            let totalIncome = 0;
            let totalExpense = 0;
            const categorySums = {};

            monthRecords.forEach(r => {
                if (r.type === 'income') {
                    totalIncome += r.amount;
                } else if (r.type === 'expense') {
                    totalExpense += r.amount;
                    categorySums[r.category] = (categorySums[r.category] || 0) + r.amount;
                }
            });

            const netBalance = totalIncome - totalExpense;

            document.getElementById('sumIncome').innerText = `NT$ ${totalIncome.toLocaleString()}`;
            document.getElementById('sumExpense').innerText = `NT$ ${totalExpense.toLocaleString()}`;
            
            const netElem = document.getElementById('sumNetBalance');
            netElem.innerText = `NT$ ${netBalance.toLocaleString()}`;
            netElem.className = `text-3xl font-extrabold ${netBalance >= 0 ? 'text-muji-dark' : 'text-muji-expense'}`;

            document.getElementById('balanceStatusText').innerText = netBalance >= 0 ? '財務狀況健康，繼續保持！' : '本月支出已超出收入，請注意開支。';

            const breakdownContainer = document.getElementById('categoryBreakdown');
            const sortedCategories = Object.entries(categorySums).sort((a, b) => b - a);

            if (sortedCategories.length === 0) {
                breakdownContainer.innerHTML = `<p class="text-xs text-muji-muted text-center py-2">本月尚無支出分類數據</p>`;
                return;
            }

            breakdownContainer.innerHTML = sortedCategories.map(([cat, sum]) => {
                const percent = totalExpense > 0 ? ((sum / totalExpense) * 100).toFixed(1) : 0;
                return `
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs text-muji-dark">
                            <span class="font-medium">${cat}</span>
                            <span class="text-muji-muted">$${sum.toLocaleString()} (${percent}%)</span>
                        </div>
                        <div class="w-full h-2 bg-muji-bg rounded-full overflow-hidden border border-muji-border/50">
                            <div class="h-full bg-muji-expense/80 rounded-full" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function changeSummaryMonth(offset) {
            const [y, m] = summaryYearMonth.split('-').map(Number);
            const date = new Date(y, m - 1 + offset, 1);
            const newY = date.getFullYear();
            const newM = String(date.getMonth() + 1).padStart(2, '0');
            summaryYearMonth = `${newY}-${newM}`;
            renderSummary();
        }

        function updateExportMonthOptions() {
            const records = getRecords();
            const exportSelect = document.getElementById('exportMonthSelect');
            if (!exportSelect) return;

            const months = [...new Set(records.map(r => r.date.slice(0, 7)))].sort().reverse();
            const nowYM = new Date().toISOString().slice(0, 7);
            if (!months.includes(nowYM)) {
                months.unshift(nowYM);
            }

            exportSelect.innerHTML = `<option value="ALL">全部歷史紀錄 (跨月)</option>` + 
                months.map(m => `<option value="${m}">${m.replace('-', ' 年 ')} 月</option>`).join('');
        }

        // 匯出 Excel
        function exportToExcel() {
            const records = getRecords();
            if (records.length === 0) {
                showToast('目前沒有可供匯出的資料', 'fa-circle-exclamation');
                return;
            }

            const selectedMonth = document.getElementById('exportMonthSelect').value;
            let targetRecords = records;
            let periodTitle = "全部月份";

            if (selectedMonth !== 'ALL') {
                targetRecords = records.filter(r => r.date.startsWith(selectedMonth));
                periodTitle = selectedMonth.replace('-', '年') + '月';
            }

            if (targetRecords.length === 0) {
                showToast('選取的月份目前沒有記帳紀錄', 'fa-circle-exclamation');
                return;
            }

            let totalIncome = 0;
            let totalExpense = 0;

            const exportData = targetRecords.map((r, index) => {
                if (r.type === 'income') totalIncome += r.amount;
                if (r.type === 'expense') totalExpense += r.amount;

                return {
                    '序號': index + 1,
                    '日期': r.date,
                    '類型': r.type === 'income' ? '收入' : '支出',
                    '分類': r.category,
                    '金額 (NT$)': r.amount,
                    '備註/細項': r.note || ''
                };
            });

            const netBalance = totalIncome - totalExpense;

            exportData.push({});
            exportData.push({
                '序號': `【${periodTitle} 統計總結】`,
                '日期': '',
                '類型': '',
                '分類': '當期總收入',
                '金額 (NT$)': totalIncome,
                '備註/細項': ''
            });
            exportData.push({
                '序號': '',
                '日期': '',
                '類型': '',
                '分類': '當期總支出',
                '金額 (NT$)': totalExpense,
                '備註/細項': ''
            });
            exportData.push({
                '序號': '',
                '日期': '',
                '類型': '',
                '分類': '結餘 (收入 - 支出)',
                '金額 (NT$)': netBalance,
                '備註/細項': netBalance >= 0 ? '財務狀況健康' : '支出超出收入'
            });

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, `${periodTitle}結餘報表`);

            worksheet['!cols'] = [{ wch: 20 }, { wch: 12 }, { wch: 8 }, { wch: 18 }, { wch: 14 }, { wch: 24 }];

            const fileName = `極簡記帳_${periodTitle}_明細與結餘總表_${new Date().toISOString().slice(0, 10)}.xlsx`;
            XLSX.writeFile(workbook, fileName);
            showToast(`已成功匯出 ${periodTitle} Excel 報表！`);
        }

        // ===== JSON 備份與還原邏輯引擎 =====

        // 1. 導出 JSON 檔案 (.json) - 支援 iOS 原生 Web Share API
        async function exportJsonFile() {
            const records = getRecords();
            const customCategories = getCustomCategories();

            const backupObj = {
                version: "1.0",
                exportedAt: new Date().toISOString(),
                records,
                customCategories
            };

            const jsonStr = JSON.stringify(backupObj, null, 2);
            const fileName = `無印極簡記帳_JSON備份檔_${new Date().toISOString().slice(0, 10)}.json`;

            try {
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const file = new File([blob], fileName, { type: 'application/json' });

                // 在 iPhone Safari 優先呼叫原生分享彈出選單
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: '無印極簡記帳 備份檔',
                        text: '這是我儲存的個人記帳備份 JSON 檔案',
                        files: [file]
                    });
                    showToast('已開啟備份分享！');
                    return;
                }
            } catch (err) {
                console.log('Web share API bypassed or canceled:', err);
            }

            // 標準瀏覽器 Blob 觸發下載
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('已匯出 JSON 備份檔！');
        }

        // 2. 複製 JSON 備份文字至剪貼簿
        function copyJsonText() {
            const records = getRecords();
            const customCategories = getCustomCategories();

            const backupObj = {
                version: "1.0",
                exportedAt: new Date().toISOString(),
                records,
                customCategories
            };

            const jsonStr = JSON.stringify(backupObj);

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(jsonStr).then(() => {
                    showToast('已複製 JSON 備份文字至剪貼簿！');
                }).catch(() => {
                    fallbackCopyText(jsonStr);
                });
            } else {
                fallbackCopyText(jsonStr);
            }
        }

        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('已複製 JSON 備份文字至剪貼簿！');
            } catch (err) {
                showToast('複製失敗，請使用檔案備份', 'fa-circle-exclamation');
            }
            document.body.removeChild(textArea);
        }

        // 3. 上傳 JSON 檔案還原
        function importJsonFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const parsed = JSON.parse(event.target.result);
                    applyJsonDataRestore(parsed);
                } catch (err) {
                    showToast('格式錯誤：無法解析備份檔案', 'fa-circle-exclamation');
                }
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        // 4. 貼上 JSON 文字還原 Modal 觸發與處理 (新增)
        function openTextRestoreModal() {
            document.getElementById('jsonPasteArea').value = '';
            document.getElementById('textRestoreModal').classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeTextRestoreModal() {
            document.getElementById('textRestoreModal').classList.add('opacity-0', 'pointer-events-none');
        }

        function processTextRestore() {
            const text = document.getElementById('jsonPasteArea').value.trim();
            if (!text) {
                showToast('請先貼上 JSON 備份文字', 'fa-circle-exclamation');
                return;
            }

            try {
                const parsed = JSON.parse(text);
                closeTextRestoreModal();
                applyJsonDataRestore(parsed);
            } catch (err) {
                showToast('格式錯誤，無法解析 JSON 文字', 'fa-circle-exclamation');
            }
        }

        // 統一還原邏輯套用
        function applyJsonDataRestore(parsed) {
            if (!parsed || (typeof parsed !== 'object')) {
                showToast('還原失敗：無效的 JSON 數據', 'fa-circle-exclamation');
                return;
            }

            let recordsToRestore = [];
            let customToRestore = { expense: [], income: [] };

            if (Array.isArray(parsed)) {
                recordsToRestore = parsed;
            } else {
                if (Array.isArray(parsed.records)) recordsToRestore = parsed.records;
                if (parsed.customCategories && typeof parsed.customCategories === 'object') {
                    customToRestore = parsed.customCategories;
                }
            }

            if (confirm(`確認要還原 ${recordsToRestore.length} 筆記帳紀錄與自訂分類嗎？
此操作將覆蓋目前的本機資料。`)) {
                saveRecordsToStorage(recordsToRestore);
                saveCustomCategories(customToRestore);

                showToast('🎉 資料成功還原！');
                renderCategories();
                renderList();
                renderSummary();
                updateExportMonthOptions();
            }
        }

        // 清除本機所有資料
        function clearAllData() {
            if (confirm('確定要清除所有本機記帳紀錄嗎？此動作無法復原！')) {
                localStorage.removeItem('muji_accounting_records');
                localStorage.removeItem('muji_custom_categories');
                showToast('資料已全數清空');
                renderCategories();
                renderList();
                renderSummary();
                updateExportMonthOptions();
            }
        }

        // 切換分頁 Tabs
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const targetTab = document.getElementById(`tab-${tabId}`);
            if (targetTab) targetTab.classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = "nav-btn flex-1 flex flex-col items-center space-y-1 text-muji-muted hover:text-muji-dark";
            });
            const activeNav = document.getElementById(`nav-${tabId}`);
            if (activeNav) {
                activeNav.className = "nav-btn flex-1 flex flex-col items-center space-y-1 text-muji-dark font-bold";
            }

            if (tabId === 'settings') {
                updateExportMonthOptions();
            }
        }

        // 更新頂部年月
        function updateHeaderMonth() {
            const now = new Date();
            document.getElementById('headerMonth').innerText = `${now.getFullYear()} 年 ${now.getMonth() + 1} 月`;
        }

        // 顯示 Toast 提示
        function showToast(msg, icon = 'fa-circle-check') {
            const toast = document.getElementById('toast');
            if (!toast) return;
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').className = `fa-solid ${icon} text-emerald-400`;
            
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        // 動態生成 180x180 px iOS 桌面手帳 App 圖示
        function generateHighResAppleTouchIcon() {
            const canvas = document.createElement('canvas');
            canvas.width = 180;
            canvas.height = 180;
            const ctx = canvas.getContext('2d');

            // 1. 底圖: 暖白底色
            ctx.fillStyle = '#FAF7F2';
            ctx.fillRect(0, 0, 180, 180);

            // 2. 活頁手帳封面卡片 (微導角影)
            ctx.fillStyle = '#FFFFFF';
            ctx.shadowColor = 'rgba(59, 54, 50, 0.12)';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 4;
            ctx.beginPath();
            ctx.roundRect(16, 16, 148, 148, 24);
            ctx.fill();

            // 重置陰影
            ctx.shadowColor = 'transparent';

            // 3. 活頁書脊裝飾 (燕麥奶配色)
            ctx.fillStyle = '#D4C3AC';
            ctx.fillRect(16, 16, 28, 148);

            // 4. 線圈孔 (點點質感)
            ctx.fillStyle = '#8C827A';
            for (let y = 32; y <= 148; y += 24) {
                ctx.beginPath();
                ctx.arc(30, y, 3.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // 5. 書籤條 (莫蘭迪陶土紅)
            ctx.fillStyle = '#C05A46';
            ctx.fillRect(124, 16, 16, 68);
            ctx.beginPath();
            ctx.moveTo(124, 84);
            ctx.lineTo(132, 76);
            ctx.lineTo(140, 84);
            ctx.fill();

            // 6. 手帳封面金屬質感 Icon
            ctx.fillStyle = '#3B3632';
            ctx.font = '900 48px "Font Awesome 6 Free", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('📖', 100, 102);

            // 設定至 Apple Touch Icon 連結
            const iconUrl = canvas.toDataURL('image/png');
            document.getElementById('appleTouchIcon').href = iconUrl;
        }
    </script>
